/* =========================================================
   自動下書き保存（この端末のブラウザ内）と、閉じる前の警告
   ========================================================= */
const DRAFT_KEY = "koutei_draft_v1";
let DIRTY = false, SAVED_SNAP = null;

function storeOK() { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch (e) { return false; } }
const HAS_STORE = storeOK();

function saveDraft() {
  if (!HAS_STORE || !DIRTY) return;
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ t: Date.now(), name: S.meta.project || "", s: cleanState() }));
  } catch (e) { /* 容量オーバー等は黙って諦める */ }
}
function clearDraft() { if (HAS_STORE) { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} } }
function readDraft() {
  if (!HAS_STORE) return null;
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) { return null; }
}
function markSaved() { DIRTY = false; SAVED_SNAP = JSON.stringify(S); clearDraft(); }
function markDirty() { DIRTY = (JSON.stringify(S) !== SAVED_SNAP); }

setInterval(saveDraft, 30000);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveDraft(); });
window.addEventListener("pagehide", saveDraft);
window.addEventListener("beforeunload", ev => {
  saveDraft();
  if (!DIRTY) return;
  ev.preventDefault(); ev.returnValue = "";   // ブラウザ標準の確認ダイアログ
  return "";
});

function offerRestore() {
  const d = readDraft(); if (!d || !d.s) return;
  const dt = new Date(d.t);
  const two = n => ("0" + n).slice(-2);
  $("#restoreMsg").textContent =
    "前回の作業（" + (dt.getMonth() + 1) + "/" + dt.getDate() + " " + two(dt.getHours()) + ":" + two(dt.getMinutes()) + "）が残っています。"
    + (d.name ? "【" + d.name + "】" : "");
  $("#restoreBar").classList.add("on");
  $("#btnRestore").onclick = () => {
    S = Object.assign(blankState(), d.s);
    uid = 1; S.rows.concat(S.bars, S.notes).forEach(o => { const m = /^x(\d+)$/.exec(o.id || ""); if (m) uid = Math.max(uid, +m[1] + 1); });
    $("#restoreBar").classList.remove("on");
    HIST.stack = []; HIST.idx = -1;
    select(null); syncFields(); render(); histPush(); DIRTY = true;
  };
  $("#btnDiscard").onclick = () => { clearDraft(); $("#restoreBar").classList.remove("on"); };
}


/* =========================================================
   iPhone / iPad：文字入力で画面が勝手に拡大されるのを防ぐ
   ========================================================= */
(function iosZoomGuard() {
  if (!matchMedia("(pointer: coarse)").matches) return;

  // 表の中の入力欄（工種名・ヘッダ）は小さい文字なので、
  // 触れた瞬間だけ16pxに上げてから入力させる（iOSの自動拡大の条件を外す）
  document.addEventListener("pointerdown", ev => {
    const t = ev.target;
    if (!t || !t.classList) return;
    if (t.classList.contains("fld") || t.classList.contains("rsel") || t.classList.contains("rfree") || t.id === "fRemarks") {
      if (t.dataset.fs0 === undefined) t.dataset.fs0 = t.style.fontSize || "";
      t.style.fontSize = "16px";
    }
  }, true);

  document.addEventListener("focusout", ev => {
    const t = ev.target;
    if (t && t.dataset && t.dataset.fs0 !== undefined) { t.style.fontSize = t.dataset.fs0; delete t.dataset.fs0; }
    // 入力を終えたら、拡大されたままの表示を元に戻す
    setTimeout(() => {
      window.scrollTo(0, 0);
      const vp = document.getElementById("vp");
      if (!vp) return;
      const keep = vp.getAttribute("content");
      vp.setAttribute("content", "width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover");
      setTimeout(() => vp.setAttribute("content", keep), 60);
      render();
    }, 80);
  }, true);

  // キーボードの開閉で表示域が変わったら作り直す（メニューが画面外に残らないように）
  if (window.visualViewport) {
    let vt = null;
    const onVV = () => { clearTimeout(vt); vt = setTimeout(() => { window.scrollTo(0, 0); render(); }, 150); };
    visualViewport.addEventListener("resize", onVV);
  }
})();

/* =========================================================
   拡大縮小：ピンチ（2本指）／Ctrl+ホイール
   ========================================================= */
function setZoom(nz, cx, cy) {
  const st = $("#stage");
  const old = z;
  nz = Math.max(0.35, Math.min(2.2, nz));
  if (Math.abs(nz - old) < 0.001) return;
  const r = st.getBoundingClientRect();
  // 指の中心（またはカーソル）の下にある位置を動かさない
  const px = (cx === undefined ? r.width / 2 : cx - r.left) + st.scrollLeft;
  const py = (cy === undefined ? r.height / 2 : cy - r.top) + st.scrollTop;
  z = nz;
  $("#inZoom").value = Math.round(z * 100);
  $("#zoomval").textContent = Math.round(z * 100) + "%";
  render();
  const k = z / old;
  st.scrollLeft = px * k - ((cx === undefined ? r.width / 2 : cx - r.left));
  st.scrollTop  = py * k - ((cy === undefined ? r.height / 2 : cy - r.top));
}

(function enablePinch() {
  const st = $("#stage"), sheet = $("#sheet");
  let pin = null, raf = null;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const midX = t => (t[0].clientX + t[1].clientX) / 2;
  const midY = t => (t[0].clientY + t[1].clientY) / 2;

  /* 2本指の間は再描画せず transform だけ動かす（＝なめらかに無段階で拡縮・移動）。
     指を離した時点で本当の拡大率に作り直す。 */
  function begin(ts) {
    if (drag) { if (drag.ghost && drag.ghost.parentNode) drag.ghost.remove(); drag = null; }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const r = st.getBoundingClientRect();
    pin = {
      d0: dist(ts) || 1, z0: z,
      sl: st.scrollLeft, stp: st.scrollTop,
      ox: sheet.offsetLeft, oy: sheet.offsetTop,
      r: r, vs: st.scrollLeft, vt: st.scrollTop, k: 1
    };
    // 指の中心の下にある「中身の座標」
    pin.px = pin.sl + (midX(ts) - r.left) - pin.ox;
    pin.py = pin.stp + (midY(ts) - r.top)  - pin.oy;
    sheet.style.transformOrigin = "0 0";
    sheet.style.willChange = "transform";
  }

  function move(ts) {
    const k0 = dist(ts) / pin.d0;
    const k = Math.max(0.35 / pin.z0, Math.min(2.2 / pin.z0, k0));   // 拡大率の上下限
    const mx = midX(ts), my = midY(ts);
    // 指を離したときに使う「本来のスクロール位置」
    let vs = pin.ox + pin.px * k - (mx - pin.r.left);
    let vt = pin.oy + pin.py * k - (my - pin.r.top);
    const maxS = Math.max(0, sheet.offsetWidth  * k + pin.ox * 2 - st.clientWidth);
    const maxT = Math.max(0, sheet.offsetHeight * k + pin.oy * 2 - st.clientHeight);
    vs = Math.max(0, Math.min(maxS, vs));
    vt = Math.max(0, Math.min(maxT, vt));
    pin.k = k; pin.vs = vs; pin.vt = vt;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      if (!pin) return;
      sheet.style.transform = "translate(" + (pin.sl - pin.vs) + "px," + (pin.stp - pin.vt) + "px) scale(" + pin.k + ")";
    });
  }

  function end() {
    if (!pin) return;
    const p = pin; pin = null;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    sheet.style.transform = ""; sheet.style.willChange = "";
    z = Math.max(0.35, Math.min(2.2, p.z0 * p.k));
    $("#inZoom").value = Math.round(z * 100);
    $("#zoomval").textContent = Math.round(z * 100) + "%";
    render();
    st.scrollLeft = p.vs; st.scrollTop = p.vt;
  }

  st.addEventListener("touchstart", ev => { if (ev.touches.length === 2) begin(ev.touches); }, { passive:false });
  st.addEventListener("touchmove",  ev => { if (pin && ev.touches.length === 2) { ev.preventDefault(); move(ev.touches); } }, { passive:false });
  st.addEventListener("touchend",   ev => { if (pin && (!ev.touches || ev.touches.length < 2)) end(); });
  st.addEventListener("touchcancel", () => end());

  // トラックパッドのピンチ／Ctrl+ホイール
  st.addEventListener("wheel", ev => {
    if (!ev.ctrlKey && !ev.metaKey) return;
    ev.preventDefault();
    setZoom(z * (1 - ev.deltaY * 0.01), ev.clientX, ev.clientY);
  }, { passive:false });

  window.__pinch = { begin, move, end, get on(){ return !!pin; } };
  window.__pinchK = () => pin ? pin.k : 0;   // 動作確認用
})();

/* =========================================================
   画像（PNG）書き出し：画面と同じものを canvas に描き直す
   ========================================================= */
function buildCanvas(SC, D1, D2) {
  SC = SC || 2;
  const d1 = D1 || 1, d2 = D2 || S.days;
  const cw = BASE.COLW, nw = BASE.NAMEW, days = d2 - d1 + 1;
  const W = nw + days * cw;
  const geo = computeGeo();
  const HR = (function () {
    const rs = [];
    if (S.startDate) rs.push({ k:"m", h:BASE.HM });
    if (showNum())   rs.push({ k:"n", h:BASE.HN });
    if (S.startDate) { rs.push({ k:"d", h: showNum() ? BASE.HD : BASE.HN }); rs.push({ k:"w", h:BASE.HW }); }
    else             rs.push({ k:"blank", h:BASE.HD });
    return rs;
  })();
  const hh = HR.reduce((a, r) => a + r.h, 0);
  const bodyH = geo.rowH.reduce((a, b) => a + b, 0);
  const chartH = hh + bodyH;
  const PAD = 16, PADT = 12;
  const HEADB = (W < 1000) ? 68 : 52;
  const remLines = String(S.remarks || "").split("\n");
  const REM = 8 + 14 + remLines.length * 14 + 6;
  const HDRW = Math.max(W, 560);                 // ヘッダが潰れない最低幅
  const CWID = HDRW + PAD * 2, CHGT = PADT + HEADB + chartH + REM + PADT;

  SC = Math.max(1, Math.min(SC, 9000 / Math.max(CWID, CHGT)));   // 端末が扱えない巨大画像を防ぐ
  const cv = document.createElement("canvas");
  cv.width = Math.round(CWID * SC); cv.height = Math.round(CHGT * SC);
  const g = cv.getContext("2d");
  g.scale(SC, SC);
  g.fillStyle = "#fff"; g.fillRect(0, 0, CWID, CHGT);

  const FF = '"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif';
  const setF = (sz, bold) => { g.font = (bold ? "bold " : "") + sz + "px " + FF; };
  const T = (t, x, y, sz, col, align, bold) => {
    if (t === undefined || t === null || t === "") return;
    setF(sz, bold); g.fillStyle = col || "#000"; g.textAlign = align || "left"; g.textBaseline = "middle";
    g.fillText(String(t), Math.round(x * 2) / 2, Math.round(y * 2) / 2);
  };
  const line = (x1, y1, x2, y2, col, wdt, dash) => {
    g.save(); g.beginPath(); g.strokeStyle = col; g.lineWidth = wdt || 1;
    if (dash) g.setLineDash([4, 3]);
    g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore();
  };
  const rect = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };

  /* ---- 表題まわり ---- */
  /* 日数が少ないと横幅が足りないので、そのときは見出しを3段に組み替える */
  const NARROW = W < 1000;
  let y = PADT + 12;
  const TTL = "工 事 工 程 表", TTLSZ = 12;
  setF(TTLSZ, true);
  const ttlW = g.measureText(TTL).width;
  const projX = PAD + ttlW + 18;
  const proj  = S.meta.project || "現場名・工事名";
  const fit = (txt, size, minSize, limit) => {          // 入る大きさまで縮め、それでも無理なら省略
    let sz = size, t = txt;
    setF(sz, true);
    while (sz > minSize && g.measureText(t).width > limit) { sz -= 0.5; setF(sz, true); }
    while (t.length > 3 && g.measureText(t).width > limit) t = t.slice(0, -1);
    if (t !== txt) t = t.slice(0, -1) + "…";
    return { t, sz };
  };
  setF(13, true);
  const coTxt = S.meta.co || "会社名";
  const coW = g.measureText(coTxt).width;

  T(TTL, PAD, y, TTLSZ, "#666", "left", true);
  T(coTxt, PAD + HDRW, y, 13, S.meta.co ? "#000" : "#9aa1ab", "right", true);

  if (NARROW) {
    const p = fit(proj, 16, 10, (PAD + HDRW - coW - 22) - projX);
    T(p.t, projX, y, p.sz, S.meta.project ? "#000" : "#9aa1ab", "left", true);
    T("住所：", PAD, y + 21, 10, "#333");
    T(S.meta.addr || "〒000-0000　○○", PAD + 32, y + 21, 10, S.meta.addr ? "#000" : "#9aa1ab");
    T(S.meta.coAddr || "〒000-0000　○○", PAD + HDRW, y + 21, 9, S.meta.coAddr ? "#000" : "#9aa1ab", "right");
    const y3 = y + 40;
    let x = PAD;
    const seg = (lab, val, labSz) => {
      T(lab, x, y3, labSz || 10, "#333");
      setF(labSz || 10, false); x += g.measureText(lab).width + 4;
      const v = String(val || "");
      T(v, x, y3, 10.5); setF(10.5, false); x += g.measureText(v).width + 18;
    };
    seg("工期：", (S.meta.term1 || "") + " " + (S.meta.term2 || ""));
    seg("監理：", S.meta.kanri);
    seg("tel：", S.meta.tel);
  } else {
    const termX  = PAD + HDRW * 0.42;
    const kanriX = PAD + HDRW * 0.60;
    const p = fit(proj, 17, 10, (termX - 22) - projX);
    T(p.t, projX, y, p.sz, S.meta.project ? "#000" : "#9aa1ab", "left", true);
    T("住所：", PAD, y + 22, 10.5, "#333");
    T(S.meta.addr || "〒000-0000　○○", PAD + 34, y + 22, 10.5, S.meta.addr ? "#000" : "#9aa1ab");
    T("工期：", termX, y, 10.5, "#333");
    T(S.meta.term1, termX + 38, y, 11);
    T(S.meta.term2, termX + 38, y + 22, 11);
    T("監理：", kanriX, y, 10.5, "#333");
    T(S.meta.kanri, kanriX + 38, y, 11);
    T("tel　：", kanriX, y + 22, 10.5, "#333");
    T(S.meta.tel, kanriX + 38, y + 22, 11);
    T(S.meta.coAddr || "〒000-0000　○○", PAD + HDRW, y + 20, 9.5, S.meta.coAddr ? "#000" : "#9aa1ab", "right");
  }

  /* ---- 表 ---- */
  const X0 = PAD, Y0 = PADT + HEADB;          // 表の左上
  const TX = X0 + nw;                          // 日程エリアの左端
  const colX = i => TX + (i - d1) * cw;
  const bodyTop = Y0 + hh, bodyBot = Y0 + chartH;
  const fillTop = bodyTop;

  // 行の背景 → 列の色
  let ry = bodyTop;
  S.rows.forEach((r, ri) => { if (r.bg) rect(TX, ry, W - nw, geo.rowH[ri], r.bg); ry += geo.rowH[ri]; });
  for (let i = d1; i <= d2; i++) {
    const ci = colInfo(i);
    if (ci.fill && FILLS[ci.fill]) rect(colX(i), fillTop, cw, bodyBot - fillTop, FILLS[ci.fill]);
  }

  // ヘッダ（月／番号／日／曜）
  const mainKey = showNum() ? "n" : (S.startDate ? "d" : "n");
  let hy = Y0;
  HR.forEach(rd => {
    if (rd.k === "m") {
      let i = d1;
      while (i <= d2) {
        const d = dateOfDay(i); let j = i;
        while (j + 1 <= d2 && dateOfDay(j + 1).getMonth() === d.getMonth()) j++;
        T((d.getMonth() + 1) + "月", (colX(i) + colX(j) + cw) / 2, hy + rd.h / 2, 9.5, "#000", "center", true);
        line(colX(j) + cw, hy, colX(j) + cw, hy + rd.h, "#999", 1);
        i = j + 1;
      }
      line(X0, hy + rd.h, X0 + W, hy + rd.h, "#000", 1);
      hy += rd.h; return;
    }
    if (rd.k === mainKey) T("工事内容　　日程", X0 + nw / 2, hy + rd.h / 2, 11, "#000", "center", true);
    for (let i = d1; i <= d2; i++) {
      const ci = colInfo(i);
      if (ci.fill && FILLS[ci.fill]) rect(colX(i), hy, cw, rd.h, FILLS[ci.fill]);
      const d = dateOfDay(i);
      const col = d ? (((S.useHolidays && isHoliday(d)) || d.getDay() === 0) ? "#cc0000" : (d.getDay() === 6 ? "#1560c9" : "#000")) : "#000";
      if (rd.k === "n") T(dayNo(i), colX(i) + cw / 2, hy + rd.h / 2, 9.5, "#000", "center", true);
      else if (rd.k === "d" && d) T(d.getDate(), colX(i) + cw / 2, hy + rd.h / 2, 9, col, "center", !showNum());
      else if (rd.k === "w" && d) T("日月火水木金土"[d.getDay()], colX(i) + cw / 2, hy + rd.h / 2, 9, col, "center");
      line(colX(i) + cw, hy, colX(i) + cw, hy + rd.h, "#bbb", 1);
    }
    if (rd.k === mainKey) line(X0, hy + rd.h, X0 + W, hy + rd.h, "#000", 1);
    hy += rd.h;
  });
  line(X0, bodyTop, X0 + W, bodyTop, "#000", 1);

  // 本体の罫線・工種名
  for (let i = d1; i < d2; i++) line(colX(i) + cw, bodyTop, colX(i) + cw, bodyBot, "#c4c4c4", 1);
  ry = bodyTop;
  S.rows.forEach((r, ri) => {
    ry += geo.rowH[ri];
    line(X0, ry, X0 + W, ry, "#999", 1);
    T(r.name, X0 + nw / 2, ry - geo.rowH[ri] / 2, 11.5, "#000", "center");
  });
  line(TX, Y0, TX, bodyBot, "#000", 1);
  g.strokeStyle = "#000"; g.lineWidth = 1; g.strokeRect(X0 + .5, Y0 + .5, W - 1, chartH - 1);

  // 縦書き（1文字ずつ）
  for (let i = d1; i <= d2; i++) {
    const ci = colInfo(i); if (!ci.vtext) continue;
    const chars = Array.from(ci.vtext), lh = 11 * 1.18;
    let cy = (bodyTop + bodyBot) / 2 - (chars.length - 1) * lh / 2;
    chars.forEach(ch => { T(ch, colX(i) + cw / 2, cy, 11, ci.vcolor, "center", true); cy += lh; });
  }

  // バー
  ry = bodyTop;
  S.rows.forEach((r, ri) => {
    const H = geo.rowH[ri], lanes = geo.lanesArr[ri], LH = geo.laneHs[ri];
    S.bars.filter(b => b.row === r.id).forEach(b => {
      if (b.end < d1 || b.start > d2) return;               // この用紙には出ない
      const lane = geo.maps[ri][b.id] || 0;
      const yc = ry + (H - lanes * LH) / 2 + lane * LH + LH * 0.40;
      const cs = Math.max(b.start, d1), ce = Math.min(b.end, d2);
      const x1 = colX(cs) + cw / 2, x2 = colX(ce) + cw / 2;
      const col = b.color || COLORS.black;
      if (x2 > x1) line(x1, yc, x2, yc, col, 1.6, !!b.dash);
      if (b.dots !== false || x2 === x1) {
        g.fillStyle = col;
        if (b.start >= d1) { g.beginPath(); g.arc(x1, yc, 3, 0, Math.PI * 2); g.fill(); }
        if (b.end   <= d2) { g.beginPath(); g.arc(x2, yc, 3, 0, Math.PI * 2); g.fill(); }
      }
      if (b.label) {
        const sz = b.fs || BASE.FS, ls = String(b.label).split("\n"), lh = sz * 1.22;
        const al = b.align || "center";
        const ax = al === "left" ? x1 : (al === "right" ? x2 : (x1 + x2) / 2);
        g.save(); g.beginPath(); g.rect(TX, 0, days * cw, CHGT); g.clip();
        let ly = (b.pos === "above") ? yc - BASE.LABGAP - ls.length * lh + lh / 2 : yc + BASE.LABGAP + lh / 2;
        ls.forEach(t => { T(t, ax, ly, sz, b.labColor || col, al === "left" ? "left" : (al === "right" ? "right" : "center")); ly += lh; });
        g.restore();
      }
    });
    ry += H;
  });

  // 自由注記（横書き／縦書き・文字背景）
  const _tops = rowTops(geo);
  S.notes.forEach(n => {
    const sz = n.fs || BASE.FS, col = n.color || "#000";
    let nx = n.x, ny = n.y;
    if (n.row) { const ri = S.rows.findIndex(r => r.id === n.row);
      if (ri >= 0) { nx = (Math.min(n.day, S.days) - 1) * cw + (n.ox || 0); ny = _tops[ri] + (n.oy || 0); } }
    const x = TX + nx - (d1 - 1) * cw, y = bodyTop + ny;
    if (x + 200 < TX || x > TX + days * cw) return;
    if (n.vert) {
      const chars = Array.from(String(n.text).replace(/\n/g, "")), lh = sz * 1.18;
      if (n.bg) rect(x, y, sz + 6, chars.length * lh + 2, n.bg);
      chars.forEach((ch, k) => T(ch, x + (sz + 6) / 2, y + 1 + lh / 2 + k * lh, sz, col, "center"));
    } else {
      const ls = String(n.text).split("\n"), lh = sz * 1.25;
      if (n.bg) {
        setF(sz); let w = 0; ls.forEach(t => { w = Math.max(w, g.measureText(t).width); });
        rect(x, y, w + 6, ls.length * lh + 2, n.bg);
      }
      ls.forEach((t, k) => T(t, x + 3, y + 1 + lh / 2 + k * lh, sz, col));
    }
  });

  // 特記事項
  const RY = Y0 + chartH;
  g.strokeStyle = "#000"; g.lineWidth = 1; g.strokeRect(X0 + .5, RY + .5, W - 1, REM - 1);
  T("【特記事項】", X0 + 8, RY + 12, 10, "#000", "left", true);
  remLines.forEach((t, k) => T(t, X0 + 8, RY + 28 + k * 14, 10));

  return cv;
}

function checkOverflowBeforeExport() {
  const ovf = overflowLabels();
  if (!ovf.length) return true;
  return confirm(ovf.length + " 件のラベルが表の外にはみ出しているため、画像では切れます。\n\n" +
    ovf.slice(0, 6).map(t => "・" + t).join("\n") + (ovf.length > 6 ? "\n…ほか " + (ovf.length - 6) + " 件" : "") +
    "\n\n直し方：そのバーを選んで「揃え」を左／右にするか、文字を小さくしてください。\n\nこのまま書き出しますか？");
}
function busy(on, msg) {
  let b = $("#busy");
  if (!b) { b = el("div"); b.id = "busy"; document.body.appendChild(b); }
  b.textContent = msg || "作成中…";
  b.style.display = on ? "flex" : "none";
}
function canvasBlob() {
  return new Promise(res => {
    busy(true, "画像を作成中…");
    setTimeout(() => {
      buildCanvas(2).toBlob(b => { busy(false); res(b); }, "image/png");
    }, 30);
  });
}
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* =========================================================
   Excel（.xlsx）書き出し
   ライブラリを使わず、ZIPとシートのXMLを自前で組み立てる
   ========================================================= */
function crc32(buf) {
  if (!crc32.tbl) {
    crc32.tbl = [];
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); crc32.tbl[n] = c >>> 0; }
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ crc32.tbl[(crc ^ buf[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const enc = new TextEncoder();
  const u16 = v => [v & 255, (v >>> 8) & 255];
  const u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const body = []; const cen = []; let off = 0, cenLen = 0;
  files.forEach(f => {
    const nb = enc.encode(f.name), data = f.data, crc = crc32(data), n = data.length;
    const loc = new Uint8Array([].concat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(n), u32(n), u16(nb.length), u16(0)));
    body.push(loc, nb, data);
    const h = new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(n), u32(n), u16(nb.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off)));
    cen.push(h, nb); cenLen += h.length + nb.length;
    off += loc.length + nb.length + n;
  });
  const end = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cenLen), u32(off), u16(0)));
  return new Blob(body.concat(cen, [end]), { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

function buildXlsx() {
  const X  = t => String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const enc = new TextEncoder();
  const geo = computeGeo();
  const D = S.days;
  const colLetter = n => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };
  const cellRef = (r, c) => colLetter(c) + r;
  const dayCol = i => 1 + i;                 // A列＝工種名、B列＝1日目

  /* --- 書式（塗り色ごとに1つ作る） --- */
  const fills = ["none", "gray125"];         // 0,1 は仕様上の予約
  const fillIdx = hex => {
    if (!hex) return 0;
    const h = hex.replace("#", "").toUpperCase();
    const k = "FF" + h;
    let i = fills.indexOf(k);
    if (i < 0) { fills.push(k); i = fills.length - 1; }
    return i;
  };
  const xfs = [];                            // {fill, font, border, align, wrap}
  const xfIdx = o => {
    const key = JSON.stringify(o);
    let i = xfs.findIndex(x => JSON.stringify(x) === key);
    if (i < 0) { xfs.push(o); i = xfs.length - 1; }
    return i;
  };
  const ST = {
    plain : xfIdx({ f:0, fo:0, b:1, a:"center" }),
    head  : xfIdx({ f:0, fo:1, b:1, a:"center" }),
    title : xfIdx({ f:0, fo:2, b:0, a:"left" }),
    meta  : xfIdx({ f:0, fo:0, b:0, a:"left" }),
    name  : xfIdx({ f:0, fo:0, b:1, a:"center" }),
    sun   : xfIdx({ f:0, fo:3, b:1, a:"center" }),
    sat   : xfIdx({ f:0, fo:4, b:1, a:"center" }),
    label : xfIdx({ f:0, fo:0, b:0, a:"left" }),
    proj  : xfIdx({ f:0, fo:5, b:0, a:"left" }),
    ttl   : xfIdx({ f:0, fo:6, b:0, a:"left" })
  };
  const filled = (hex, base) => xfIdx(Object.assign({}, xfs[base === undefined ? ST.plain : base], { f: fillIdx(hex) }));

  /* --- 各日の列の色 --- */
  const colFill = {};
  for (let i = 1; i <= D; i++) { const ci = colInfo(i); colFill[i] = (ci.fill && FILLS[ci.fill]) ? FILLS[ci.fill] : ""; }

  /* --- 行を組み立てる --- */
  const rows = [];   // {r, cells:[{c, v, s, str}], h}
  const put = (r, c, v, s, isStr) => {
    let row = rows.find(x => x.r === r);
    if (!row) { row = { r, cells: [] }; rows.push(row); }
    row.cells.push({ c, v, s, str: isStr });
  };
  const setH = (r, h) => { let row = rows.find(x => x.r === r); if (!row) { row = { r, cells: [] }; rows.push(row); } row.h = h; };

  put(1, 1, "工事工程表", ST.ttl, true);
  put(1, 3, S.meta.project || "", ST.proj, true);
  put(1, dayCol(Math.max(1, Math.floor(D * 0.45))), "工期：" + (S.meta.term1 || "") + " " + (S.meta.term2 || ""), ST.meta, true);
  put(1, dayCol(Math.max(1, Math.floor(D * 0.80))), S.meta.co || "", ST.meta, true);
  put(2, 1, "住所：", ST.meta, true);
  put(2, 3, S.meta.addr || "", ST.meta, true);
  put(2, dayCol(Math.max(1, Math.floor(D * 0.45))), "監理：" + (S.meta.kanri || "") + "　tel：" + (S.meta.tel || ""), ST.meta, true);

  const R_MON = 4, R_NUM = 5, R_DAY = 6, R_WK = 7, R_TOP = 8;
  const useNum = showNum();
  const merges = [];
  if (S.startDate) {
    let i = 1;
    while (i <= D) {
      const d = dateOfDay(i); let j = i;
      while (j + 1 <= D && dateOfDay(j + 1).getMonth() === d.getMonth()) j++;
      put(R_MON, dayCol(i), (d.getMonth() + 1) + "月", ST.head, true);
      if (j > i) merges.push(cellRef(R_MON, dayCol(i)) + ":" + cellRef(R_MON, dayCol(j)));
      i = j + 1;
    }
  }
  if (useNum) put(R_NUM, 1, "工事内容　日程", ST.head, true);
  else put(R_DAY, 1, "工事内容　日程", ST.head, true);
  for (let i = 1; i <= D; i++) {
    const base = colFill[i] ? filled(colFill[i], ST.head) : ST.head;
    if (useNum) { const n = dayNo(i); if (n === "") put(R_NUM, dayCol(i), "", base, true); else put(R_NUM, dayCol(i), n, base, false); }
    else put(R_NUM, dayCol(i), "", base, true);
    const d = dateOfDay(i);
    if (d) {
      const wd = d.getDay();
      const st = (S.useHolidays && isHoliday(d)) || wd === 0 ? ST.sun : (wd === 6 ? ST.sat : ST.plain);
      const s2 = colFill[i] ? filled(colFill[i], st) : st;
      put(R_DAY, dayCol(i), d.getDate(), s2, false);
      put(R_WK,  dayCol(i), "日月火水木金土"[wd], s2, true);
    } else {
      const s2 = colFill[i] ? filled(colFill[i], ST.plain) : ST.plain;
      put(R_DAY, dayCol(i), "", s2, true);
      put(R_WK,  dayCol(i), "", s2, true);
    }
  }
  setH(R_MON, 14); setH(R_NUM, useNum ? 15 : 3); setH(R_DAY, useNum ? 13 : 15); setH(R_WK, 13);

  let r = R_TOP;
  S.rows.forEach((row, ri) => {
    if (row.type === "spacer") {
      for (let i = 1; i <= D; i++) put(r, dayCol(i), "", colFill[i] ? filled(colFill[i]) : ST.plain, true);
      put(r, 1, "", ST.name, true); setH(r, 8); r++; return;
    }
    const lanes = Math.max(1, geo.lanesArr[ri]);
    const bars = S.bars.filter(b => b.row === row.id && b.start <= S.days);
    const first = r;
    for (let L = 0; L < lanes; L++) {
      const inLane = bars.filter(b => (geo.maps[ri][b.id] || 0) === L);
      for (let i = 1; i <= D; i++) {
        const b = inLane.find(x => i >= x.start && i <= Math.min(x.end, D));
        const hex = b ? (b.color || "#000000") : (colFill[i] || row.bg || "");
        put(r, dayCol(i), "", hex ? filled(hex) : ST.plain, true);
      }
      setH(r, 9); r++;
      // ラベル行
      for (let i = 1; i <= D; i++) put(r, dayCol(i), "", colFill[i] ? filled(colFill[i]) : (row.bg ? filled(row.bg) : ST.plain), true);
      inLane.forEach(b => { if (b.label) put(r, dayCol(b.start), String(b.label).replace(/\n/g, " "), ST.label, true); });
      setH(r, 13); r++;
    }
    put(first, 1, row.name || "", ST.name, true);
    if (r - 1 > first) merges.push(cellRef(first, 1) + ":" + cellRef(r - 1, 1));
    for (let k = first + 1; k < r; k++) put(k, 1, "", ST.name, true);
  });
  r++;
  const ms = [];
  for (let i = 1; i <= D; i++) { const ci = colInfo(i); if (ci.vtext) ms.push(i + "日目：" + ci.vtext); }
  if (ms.length) { put(r, 1, "【節目】　" + ms.join("　／　"), ST.meta, true); r++; }
  put(r, 1, "【特記事項】", ST.meta, true); r++;
  String(S.remarks || "").split("\n").forEach(t => { put(r, 1, t, ST.meta, true); r++; });

  /* --- XML --- */
  rows.sort((a, b) => a.r - b.r);
  let sheet = "";
  rows.forEach(row => {
    row.cells.sort((a, b) => a.c - b.c);
    sheet += '<row r="' + row.r + '"' + (row.h ? ' ht="' + row.h + '" customHeight="1"' : "") + ">";
    row.cells.forEach(c => {
      const ref = cellRef(row.r, c.c);
      if (c.str) {
        if (c.v === "" || c.v == null) sheet += '<c r="' + ref + '" s="' + c.s + '"/>';
        else sheet += '<c r="' + ref + '" s="' + c.s + '" t="inlineStr"><is><t xml:space="preserve">' + X(c.v) + "</t></is></c>";
      } else sheet += '<c r="' + ref + '" s="' + c.s + '"><v>' + c.v + "</v></c>";
    });
    sheet += "</row>";
  });

  let cols = '<col min="1" max="1" width="17" customWidth="1"/>';
  cols += '<col min="2" max="' + dayCol(D) + '" width="3.2" customWidth="1"/>';

  const fillsXml = fills.map(f => f === "none" ? '<fill><patternFill patternType="none"/></fill>'
    : f === "gray125" ? '<fill><patternFill patternType="gray125"/></fill>'
    : '<fill><patternFill patternType="solid"><fgColor rgb="' + f + '"/><bgColor indexed="64"/></patternFill></fill>').join("");
  const fontsXml =
    '<font><sz val="9"/><name val="ＭＳ Ｐゴシック"/></font>' +
    '<font><b/><sz val="9"/><name val="ＭＳ Ｐゴシック"/></font>' +
    '<font><b/><sz val="14"/><name val="ＭＳ Ｐゴシック"/></font>' +
    '<font><sz val="9"/><color rgb="FFCC0000"/><name val="ＭＳ Ｐゴシック"/></font>' +
    '<font><sz val="9"/><color rgb="FF1560C9"/><name val="ＭＳ Ｐゴシック"/></font>' +
    '<font><b/><sz val="13"/><name val="ＭＳ Ｐゴシック"/></font>' +
    '<font><b/><sz val="10"/><color rgb="FF666666"/><name val="ＭＳ Ｐゴシック"/></font>';
  const bordersXml = '<border><left/><right/><top/><bottom/><diagonal/></border>' +
    '<border><left style="hair"><color rgb="FFAAAAAA"/></left><right style="hair"><color rgb="FFAAAAAA"/></right>' +
    '<top style="hair"><color rgb="FFAAAAAA"/></top><bottom style="hair"><color rgb="FFAAAAAA"/></bottom><diagonal/></border>';
  const xfXml = xfs.map(x => '<xf numFmtId="0" fontId="' + (x.fo || 0) + '" fillId="' + (x.f || 0) + '" borderId="' + (x.b || 0) +
    '" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="' + (x.a || "center") + '" vertical="center"/></xf>').join("");

  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="7">' + fontsXml + "</fonts>" +
    '<fills count="' + fills.length + '">' + fillsXml + "</fills>" +

function two(n) { return ("0" + n).slice(-2); }
function stamp() { const d = new Date(); return two(d.getMonth() + 1) + two(d.getDate()); }
function fileBase() {

let MODAL_CB = null;
function askFile(opt) {
  return new Promise(res => {
    const m = $("#modal"), body = $("#mBody");
    $("#mTitle").textContent = opt.title;
    body.innerHTML = "";
    m.querySelector(".mbox").classList.toggle("wide", !!(opt.preview && opt.preview.length));
    if (opt.preview && opt.preview.length) {
      const h = el("div", "phint");
      h.textContent = "仕上がりプレビュー" + (opt.preview.length > 1 ? "（" + opt.preview.length + "ページ）" : "") + "　※画像を押すと原寸で確認できます";
      body.appendChild(h);
      opt.preview.forEach(cv => {
        const box = el("div", "prev");
        const im = document.createElement("img");
        im.src = cv.toDataURL("image/png");
        box.appendChild(im);
        box.onclick = () => box.classList.toggle("zoom");
        body.appendChild(box);
      });
    }
    (opt.rows || []).forEach(r => {
      const d = el("div", "mrow");
      const k = el("span", "k"); k.textContent = r[0];
      const v = el("span", "v"); v.textContent = r[1];
      d.appendChild(k); d.appendChild(v); body.appendChild(d);
    });
    let inp = null;
    if (!opt.noName) {
      const row = el("div", "mrow");
      const k = el("span", "k"); k.textContent = "ファイル名";
      inp = document.createElement("input"); inp.type = "text"; inp.id = "mName"; inp.value = opt.name;
      row.appendChild(k); row.appendChild(inp);
      const ext = el("span"); ext.textContent = "." + opt.ext; ext.style.color = "#555";
      row.appendChild(ext);
      body.appendChild(row);
    }
    if (opt.note) { const n = el("div", "mnote" + (opt.warn ? " warn" : "")); n.textContent = opt.note; body.appendChild(n); }

    $("#mOk").textContent = opt.ok || "保存する";
    m.classList.add("on");
    if (inp) setTimeout(() => { inp.focus(); inp.select(); }, 30);

    const done = v => { m.classList.remove("on"); MODAL_CB = null; res(v); };
    const okv = () => inp ? ((inp.value.trim() || opt.name) + "." + opt.ext) : true;
    MODAL_CB = done;
    $("#mOk").onclick = () => done(okv());
    $("#mCancel").onclick = () => done(null);
    m.onclick = ev => { if (ev.target === m) done(null); };
    if (inp) inp.onkeydown = ev => {
      if (ev.key === "Enter") { ev.preventDefault(); done(okv()); }
      if (ev.key === "Escape") { ev.preventDefault(); done(null); }
    };
  });
}
document.addEventListener("keydown", ev => {
  if (!MODAL_CB) return;
  if (ev.key === "Escape") { ev.preventDefault(); MODAL_CB(null); }
}, true);

function cleanState() {
  const out = JSON.parse(JSON.stringify(S));
  out.rows.forEach(r => { delete r.editing; });
  // 中身のない列の設定は保存しない
  Object.keys(out.cols).forEach(k => {
    const c = out.cols[k];
    if (!c || (!c.fill && !c.vtext)) delete out.cols[k];
  });
  return out;
}

const PANELS = [["#btnSave", "#saveMenu"], ["#btnAdd", "#addPanel"], ["#btnCfg", "#cfgPanel"]];
function closePanels(except) {
  PANELS.forEach(([b, p]) => { if (p !== except) $(p).classList.remove("on"); });
}
function togglePanel(btnSel, panSel, build) {
  const p = $(panSel), b = $(btnSel);
  if (p.classList.contains("on")) { p.classList.remove("on"); return; }
  closePanels(panSel);
  if (build) build();
  p.classList.add("on");
  p.style.left = "0px";
  const r = b.getBoundingClientRect(), pr = p.getBoundingClientRect();
  let x = r.left - p.parentElement.getBoundingClientRect().left;
  const over = (r.left + pr.width) - (window.innerWidth - 8);
  if (over > 0) x -= over;
  p.style.left = Math.max(4, x) + "px";
}

};

$("#fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  if (DIRTY && !confirm("保存していない変更があります。\n読み込むと、いまの内容は失われます。\n\n続けますか？（先に「保存・共有」で保存しておくと安全です）")) return;
  const r = new FileReader();
  r.onload = () => {
    let d = null;
    try { d = JSON.parse(r.result); } catch (err) {
      alert("このファイルは読み取れませんでした。\n工程表の保存ファイル（.json）を選んでください。\n\nいまの内容はそのままです。"); return;
    }
    // 工程表の保存データかどうかを、置き換える前に確かめる
    if (!d || typeof d !== "object" || !Array.isArray(d.rows) || !Array.isArray(d.bars)) {
      alert("このファイルは工程表の保存データではないようです。\n読み込みを中止しました。\n\nいまの内容はそのままです。"); return;
    }
    const base = blankState();
    const ns = Object.assign(base, d);
    ns.meta  = Object.assign(blankState().meta, (d.meta && typeof d.meta === "object") ? d.meta : {});
    ns.rows  = d.rows.filter(x => x && x.id);
    ns.bars  = d.bars.filter(x => x && x.id && x.row);
    ns.notes = Array.isArray(d.notes) ? d.notes.filter(x => x && x.id) : [];
    ns.cols  = (d.cols && typeof d.cols === "object" && !Array.isArray(d.cols)) ? d.cols : {};
    ns.days  = Math.min(200, Math.max(5, +d.days || 44));
    ns.restWeekdays = Array.isArray(d.restWeekdays) ? d.restWeekdays : [0];
    ns.remarks = typeof d.remarks === "string" ? d.remarks : "";
    if (!ns.rows.length) { alert("行のデータが入っていないため、読み込みを中止しました。\n\nいまの内容はそのままです。"); return; }

    S = ns;                                   // ここで初めて差し替える
    uid = 1; S.rows.concat(S.bars, S.notes).forEach(o => { const m = /^x(\d+)$/.exec(o.id || ""); if (m) uid = Math.max(uid, +m[1] + 1); });
    HIST.stack = []; HIST.idx = -1;
    select(null); syncFields(); render(); histPush(); markSaved();
  };
  r.onerror = () => alert("ファイルを開けませんでした。\n\nいまの内容はそのままです。");
  r.readAsText(f, "utf-8");
});
$("#btnNew2").addEventListener("click", () => {

/* =========================================================
   PDFを自前で組み立てる（iPhone/iPadのブラウザ印刷に頼らない）
   画像1枚を1ページに貼った、用紙サイズ指定つきの正式なPDF
   ========================================================= */
function pdfFromJpegs(pages, wPt, hPt, mgPt) {
  const enc = t => { const a = new Uint8Array(t.length); for (let i = 0; i < t.length; i++) a[i] = t.charCodeAt(i) & 255; return a; };
  const parts = []; let pos = 0;
  const add  = u8 => { parts.push(u8); pos += u8.length; };
  const addS = t  => add(enc(t));
  const N = pages.length, total = 2 + N * 3, off = new Array(total + 1).fill(0);

  addS("%PDF-1.4\n%âãÏÓ\n");
  off[1] = pos; addS("1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n");
  const kids = []; for (let i = 0; i < N; i++) kids.push((3 + i * 3) + " 0 R");
  off[2] = pos; addS("2 0 obj\n<</Type/Pages/Kids[" + kids.join(" ") + "]/Count " + N + ">>\nendobj\n");

  for (let i = 0; i < N; i++) {
    const pn = 3 + i * 3, cn = 4 + i * 3, im = 5 + i * 3, p = pages[i];
    const sc = Math.min((wPt - mgPt * 2) / p.w, (hPt - mgPt * 2) / p.h);
    const dw = p.w * sc, dh = p.h * sc, dx = (wPt - dw) / 2, dy = (hPt - dh) / 2;
    off[pn] = pos; addS(pn + " 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 " + wPt.toFixed(2) + " " + hPt.toFixed(2) +
      "]/Resources<</XObject<</Im0 " + im + " 0 R>>>>/Contents " + cn + " 0 R>>\nendobj\n");
    const cs = "q " + dw.toFixed(2) + " 0 0 " + dh.toFixed(2) + " " + dx.toFixed(2) + " " + dy.toFixed(2) + " cm /Im0 Do Q\n";
    off[cn] = pos; addS(cn + " 0 obj\n<</Length " + cs.length + ">>\nstream\n" + cs + "endstream\nendobj\n");
    off[im] = pos; addS(im + " 0 obj\n<</Type/XObject/Subtype/Image/Width " + p.w + "/Height " + p.h +
      "/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length " + p.data.length + ">>\nstream\n");
    add(p.data); addS("\nendstream\nendobj\n");
  }
  const xref = pos;
  let x = "xref\n0 " + (total + 1) + "\n0000000000 65535 f \n";
  for (let n = 1; n <= total; n++) x += ("0000000000" + off[n]).slice(-10) + " 00000 n \n";
  x += "trailer\n<</Size " + (total + 1) + "/Root 1 0 R>>\nstartxref\n" + xref + "\n%%EOF\n";
  addS(x);
  return new Blob(parts, { type: "application/pdf" });
}

const isTouchDevice = () => matchMedia("(pointer: coarse)").matches;

async function doPdf() {
  const key = ($("#inPaper") && $("#inPaper").value) || "a3";
  const P = PAPERS[key] || PAPERS.a3;
  const ovf = overflowLabels();
  const rows = [["用紙", P.label + "（設定で変更できます）"]];
  if (S.meta.project) rows.push(["現場名", S.meta.project]);
  const half0 = Math.ceil(S.days / 2);
  const prevRanges = P.split ? [[1, half0], [half0 + 1, S.days]] : [[1, S.days]];
  busy(true, "プレビューを作成中…");
  await new Promise(r => setTimeout(r, 20));
  const preview = prevRanges.map(rg => buildCanvas(1.3, rg[0], rg[1]));
  busy(false);
  const n = await askFile({
    preview: preview,
    title: "PDFを作ります",
    rows: rows,
    name: fileBase(), ext: "pdf", ok: "作成する",
    warn: ovf.length > 0,
    note: ovf.length
      ? ovf.length + " 件のラベルが紙からはみ出すため切れます。\n" + ovf.slice(0, 3).map(t => "・" + t).join("\n") +
        (ovf.length > 3 ? "\n…ほか " + (ovf.length - 3) + " 件" : "") +
        "\n直すには、そのバーを選んで「揃え」を左／右にするか文字を小さくしてください。"
      : (isTouchDevice() ? "作成後、共有メニューが開きます。LINE・メール・ファイルアプリへ送れます。"
                         : "作成後、この端末にダウンロードします。")
  });
  if (!n) return;
  const pt = mm => mm / 25.4 * 72;
  busy(true, "PDFを作成中…");
  await new Promise(r => setTimeout(r, 30));
  try {
    const half = Math.ceil(S.days / 2);
    const ranges = P.split ? [[1, half], [half + 1, S.days]] : [[1, S.days]];
    const pages = [];
    for (const rg of ranges) {
      const cv = buildCanvas(4, rg[0], rg[1]);                       // 3倍→4倍（約290dpi）
      const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.96));
      pages.push({ data: new Uint8Array(await blob.arrayBuffer()), w: cv.width, h: cv.height });
    }
    const pdf = pdfFromJpegs(pages, pt(P.mm[0]), pt(P.mm[1]), pt(6));
    busy(false);
    if (isTouchDevice() && canShareFiles()) await shareFile(pdf, n, "application/pdf");
    else download(pdf, n);
  } catch (err) {
    busy(false);
    alert("PDFを作れませんでした。\n" + (err && err.message ? err.message : ""));
  }
}

const PAPERS = {
  a3:   { mm:[420,297], css:"A3 landscape", label:"A3横1枚" },
  a4:   { mm:[297,210], css:"A4 landscape", label:"A4横1枚" },
  b4:   { mm:[364,257], css:"B4 landscape", label:"B4横1枚" },
  a4x2: { mm:[297,210], css:"A4 landscape", label:"A4横2枚", split:true }
};
const MM2PX = mm => (mm - 12) / 25.4 * 96;   // 余白6mm×2を引いた印刷可能寸法

/* 紙からはみ出すラベルを探す */
function overflowLabels() {
  const cw = BASE.COLW, right = S.days * cw;
  const cv = document.createElement("canvas"), g = cv.getContext("2d");
  const out = [];
  S.bars.forEach(b => {
    if (!b.label) return;
    const sz = b.fs || BASE.FS;
    g.font = sz + 'px "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif';
    let w = 0; String(b.label).split("\n").forEach(t => { w = Math.max(w, g.measureText(t).width); });
    const x1 = (b.start - 1) * cw + cw / 2, x2 = (b.end - 1) * cw + cw / 2;
    const al = b.align || "center";
    const L = al === "left" ? x1 : (al === "right" ? x2 - w : (x1 + x2) / 2 - w / 2);
    if (L < -2 || L + w > right + 2) {
      const r = S.rows.find(r => r.id === b.row) || {};
      out.push((r.name || "（工種名なし）") + "　" + String(b.label).split("\n")[0]);
    }
  });
  return out;
}

/* 印刷時だけ、ヘッダの入力欄を中身の幅に縮める（表が紙の隅で極小になるのを防ぐ） */
function shrinkHeader(on) {
  const cv = document.createElement("canvas"), g = cv.getContext("2d");
  document.querySelectorAll("#shead .fld").forEach(inp => {
    if (!on) { inp.style.width = inp.dataset.w0 || ""; return; }
    if (inp.dataset.w0 === undefined) inp.dataset.w0 = inp.style.width || "";
    const cs = getComputedStyle(inp);
    g.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
    const t = inp.value || inp.placeholder || "";
    inp.style.width = Math.max(40, Math.ceil(g.measureText(t).width) + 12) + "px";
  });
}
async function doPrint() {
  const key = ($("#inPaper") && $("#inPaper").value) || "a3";
  const P = PAPERS[key] || PAPERS.a3;
  $("#pageCss").textContent = "@page { size: " + P.css + "; margin: 6mm; }";

  const ovf = overflowLabels();
  const half1 = Math.ceil(S.days / 2);
  busy(true, "プレビューを作成中…");
  await new Promise(r => setTimeout(r, 20));
  const pv = (P.split ? [[1, half1], [half1 + 1, S.days]] : [[1, S.days]]).map(rg => buildCanvas(1.3, rg[0], rg[1]));
  busy(false);
  const go = await askFile({
    preview: pv, title: "印刷します", ok: "印刷画面へ",
    rows: [["用紙", P.label + "（設定で変更できます）"]],
    noName: true,
    warn: ovf.length > 0,
    note: ovf.length ? ovf.length + " 件のラベルが紙からはみ出すため切れます。"
                     : "このあとブラウザの印刷画面が開きます。用紙とプリンタを選んでください。"
  });
  if (!go) return;

  if (P.split) return printSplit(P);

  const keep = z, keepSel = sel;
  z = 1; sel = null; MULTI = []; render(); refreshInsp(); shrinkHeader(true);
  requestAnimationFrame(() => {
    const sheet = $("#sheet");
    const ps = Math.min(MM2PX(P.mm[0]) / sheet.scrollWidth, MM2PX(P.mm[1]) / sheet.scrollHeight);
    if (ps < 0.65 && !confirm(
        P.label + "に収まりきらないため、縮尺 " + Math.round(ps * 100) + "% まで縮めて印刷します。\n" +
        "現場では読みづらい可能性があります。\n\n" +
        "対策：用紙を大きくする／「A4横2枚」に分ける／行の高さを下げる／日数を減らす。\n\nこのまま印刷しますか？")) {
      shrinkHeader(false); z = keep; sel = keepSel; syncFields(); render(); refreshInsp(); return;
    }
    sheet.style.setProperty("--ps", ps);
    // 縮小後の実寸を外枠に伝える（これをしないと余白が余って白紙が1枚増える）
    document.body.style.setProperty("--pw", Math.ceil(sheet.scrollWidth * ps) + "px");
    document.body.style.setProperty("--ph", Math.ceil(sheet.scrollHeight * ps) + "px");
    window.print();
    setTimeout(() => {
      document.body.style.removeProperty("--pw"); document.body.style.removeProperty("--ph");
      sheet.style.removeProperty("--ps");
      shrinkHeader(false); z = keep; sel = keepSel; syncFields(); render(); refreshInsp();
    }, 400);
  });
}

/* A4横2枚：前半・後半を画像にして2ページで印刷する */
function printSplit(P) {
  const half = Math.ceil(S.days / 2);
  const box = $("#printImgs"); box.innerHTML = "";
  busy(true, "印刷用の画像を作成中…");
  setTimeout(() => {
    const waits = [[1, half], [half + 1, S.days]].map(rg => new Promise(res => {
      const im = document.createElement("img");
      im.onload = () => res(); im.onerror = () => res();
      im.src = buildCanvas(4, rg[0], rg[1]).toDataURL("image/png");
      const d = el("div", "pg"); d.appendChild(im); box.appendChild(d);
    }));
    Promise.all(waits).then(() => {                      // 画像の読み込みを待ってから印刷
      busy(false);
      document.body.classList.add("imgprint");
      setTimeout(() => {
        window.print();
        setTimeout(() => { document.body.classList.remove("imgprint"); box.innerHTML = ""; }, 800);
      }, 60);
    });
  }, 30);
}
$("#btnPdf").addEventListener("click", doPdf);

/* 余白クリックで選択解除 */
$("#stage").addEventListener("pointerdown", ev => {
  if (ev.target.id !== "stage" && ev.target.id !== "sheet") return;
  // スクロールバーの上を掴んだときは何もしない（掴んだまま画面が動くのを防ぐ）
  const st = $("#stage"), r = st.getBoundingClientRect();
  if (ev.clientX - r.left > st.clientWidth || ev.clientY - r.top > st.clientHeight) return;
  select(null);
});

/* =========================================================
   起動
   ========================================================= */
/* 実際の幅を測りながら、画面に収まるまで縮める */
function fitToScreen(force) {
  const st = $("#stage");
  if (!force && st.scrollWidth <= st.clientWidth + 1) return false;
  if (force) { z = 2.2; setZoomValue(); render(); }
  for (let i = 0; i < 8; i++) {
    if (st.scrollWidth <= st.clientWidth - 1) break;
    const nz = Math.max(0.35, z * (st.clientWidth - 6) / st.scrollWidth);
    if (Math.abs(nz - z) < 0.005) break;
    z = nz; setZoomValue(); render();
  }
  return true;
}
function setZoomValue() {
  $("#inZoom").value = Math.round(z * 100);
  $("#zoomval").textContent = Math.round(z * 100) + "%";
}
(function registerSW() {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "https:" && location.hostname !== "localhost") return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => {
        if (w.state === "installed" && navigator.serviceWorker.controller) {
          $("#updateBar").classList.add("on");
          $("#btnUpdate").onclick = () => { w.postMessage("skipWaiting"); location.reload(); };
          $("#btnUpdateLater").onclick = () => $("#updateBar").classList.remove("on");
        }
      });
    });
  }).catch(() => {});
})();

window.__state = () => S;
window.__hist = () => HIST;
syncFields();
render();
histPush();
SAVED_SNAP = JSON.stringify(S); DIRTY = false;
fitToScreen();
offerRestore();
</script>
