<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工程表">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2b3240">
<title>工事工程表エディタ</title>
<style id="pageCss">@page { size: A3 landscape; margin: 6mm; }</style>
<style>
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html { height:100%; }
  body { margin:0; padding:0; height:100%; display:flex; flex-direction:column; -webkit-text-size-adjust:100%; overscroll-behavior:none; font-family: "Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif; background:#eef0f3; }
  button, select, input { font-family: inherit; }

  /* ---------- toolbar ---------- */
  #toolbar { flex:0 0 auto; z-index:100; display:flex; flex-wrap:wrap; gap:6px; align-items:center;
             padding:7px 10px; background:#2b3240; color:#fff; font-size:12px; }
  #toolbar .sep { width:1px; height:20px; background:#4a5464; margin:0 3px; }
  #toolbar label { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  #toolbar input[type=date], #toolbar input[type=number] { padding:3px 5px; border:1px solid #5a6474; border-radius:4px; background:#1e242e; color:#fff; font-size:12px; }
  #toolbar input[type=number] { width:58px; }
  .tb { padding:5px 10px; border:1px solid #5a6474; background:#39424f; color:#fff; border-radius:5px; cursor:pointer; font-size:12px; white-space:nowrap; }
  .tb:hover { background:#4a5563; }
  .tb.pri { background:#1f7a4d; border-color:#2a9c63; }
  .tb.pri:hover { background:#26925c; }
  #zoomval { width:38px; text-align:right; display:inline-block; }
  #hint { margin-left:auto; opacity:.75; font-size:11px; }

  /* ---------- stage ---------- */
  #stage { flex:1 1 auto; overflow:auto; padding:0; -webkit-overflow-scrolling:touch; }
  #sheet { background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.16); display:inline-block; padding:14px 16px 12px; margin:16px; }

  /* ---------- sheet header ---------- */
  #shead { display:flex; align-items:flex-start; gap:14px; padding-bottom:8px; }
  #shead .ttl { font-weight:700; letter-spacing:.35em; white-space:nowrap; }
  .fld { border:none; border-bottom:1px dotted #bbb; background:transparent; padding:1px 3px; outline:none; }
  .fld:focus { background:#fffbe6; border-bottom-color:#e8b400; }
  .lbl { color:#333; white-space:nowrap; }
  #shead .grpL { display:flex; flex-direction:column; gap:3px; }
  #shead .grpM { display:flex; flex-direction:column; gap:3px; }
  #shead .grpR { margin-left:auto; text-align:right; }
  #shead .cName { font-weight:700; }

  /* ---------- chart ---------- */
  #chart { position:relative; box-sizing:content-box; border:1px solid #000;
           -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
           -webkit-tap-highlight-color:transparent; }
  #fills { position:absolute; top:0; bottom:0; z-index:0; pointer-events:none; }
  .fill { position:absolute; }
  .rowbg { position:absolute; left:0; right:0; }
  /* 縦罫線は border で描く（印刷時に背景色をオフにしても消えない） */
  .vline { position:absolute; width:0; border-left:1px solid #c4c4c4; }
  /* 縦書きは1文字ずつ積む（ブラウザの縦書き実装に依存しないため） */
  .vtext { position:absolute; display:flex; flex-direction:column; align-items:center;
           justify-content:center; font-weight:700; pointer-events:none; overflow:hidden; }
  .vtext span { display:block; line-height:1.18; text-align:center; }

  #head { position:sticky; top:0; z-index:7; background:#fff; }
  .r { display:flex; position:relative; z-index:1; }
  .rname { position:sticky; left:0; z-index:6; background:#fff; box-shadow:-16px 0 0 #fff; border-right:1px solid #000; border-bottom:1px solid #999;
           display:flex; align-items:center; justify-content:center; text-align:center; user-select:none; }
  .rname.sel { box-shadow: inset 0 0 0 2px #2563eb; }
  /* 工種プルダウン（見た目はただの文字、クリックで一覧） */
  .rsel { appearance:none; -webkit-appearance:none; border:none; background:transparent; width:100%;
          font-family:inherit; font-size:inherit; color:inherit; text-align:center; text-align-last:center;
          cursor:pointer; padding:0 2px; outline:none; }
  .rsel:hover { background:#eef4ff; }
  .rname input.rfree { border:none; outline:none; background:#fffbe6; width:100%; text-align:center;
                       font-family:inherit; font-size:inherit; }
  .rgrip { position:absolute; left:0; top:0; bottom:0; width:12px; cursor:pointer; background:#eef2f7; }
  .rgrip:hover { background:#93c5fd; }
  .track { position:relative; border-bottom:1px solid #999; touch-action:none; }

  /* 指の操作＝スクロール優先に切り替えたとき（1本指で縦スクロール） */
  body.fingerscroll .track, body.fingerscroll .bar { touch-action:pan-y; }

  /* header rows */
  .hr .rname { border-bottom:1px solid #000; font-weight:700; }
  .hr .track { border-bottom:1px solid #000; }
  .hcell { position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center;
           border-right:1px solid #bbb; z-index:2; }
  .hcell.num { cursor:pointer; }
  .hcell.num:hover { background:rgba(37,99,235,.16); }
  .hcell.num.sel { box-shadow: inset 0 0 0 2px #2563eb; }
  .hcell.sat { color:#1560c9; } .hcell.sun { color:#cc0000; }
  .mblk { position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center;
          border-right:1px solid #999; z-index:2; font-weight:700; }

  /* bars */
  .bar { position:absolute; cursor:move; z-index:3; touch-action:none; }
  .bar .in { position:absolute; top:0; bottom:0; }
  .bar .ln { position:absolute; left:0; right:0; top:50%; border-top-width:1.4px; border-top-style:solid; }
  .bar .dot { position:absolute; top:50%; border-radius:50%; }
  .bar .lab { position:absolute; white-space:pre; line-height:1.22; pointer-events:none; }
  .bar.sel .ln { border-top-width:2.4px; }
  .bar.sel { outline:1.5px dashed #2563eb; outline-offset:2px; }
  .bar .hL, .bar .hR { position:absolute; top:0; bottom:0; width:9px; cursor:ew-resize; touch-action:none; }
  .bar .hL { left:0; } .bar .hR { right:0; }

  .ghost { position:absolute; background:rgba(37,99,235,.22); border:1px solid #2563eb; z-index:9; pointer-events:none; }

  /* free notes */
  #notes { position:absolute; top:0; left:0; right:0; bottom:0; z-index:4; pointer-events:none; }
  .note { position:absolute; white-space:pre; line-height:1.25; pointer-events:auto; cursor:move; padding:1px 3px; touch-action:none; }
  .note.vert { display:flex; flex-direction:column; align-items:center; white-space:normal; }
  .note.vert span { display:block; line-height:1.18; text-align:center; }
  .note.sel { outline:1.5px dashed #2563eb; }

  /* remarks */
  #remarks { box-sizing:content-box; border:1px solid #000; border-top:none; padding:6px 8px; }
  #remarks .rt { font-weight:700; margin-bottom:3px; }
  #remarks textarea { width:100%; border:none; outline:none; resize:none; overflow:hidden; font-family:inherit; background:transparent; }

  /* ---------- ツールバーの引き出し ---------- */
  #toolbar { position:relative; }
  .panel { display:none; position:absolute; top:calc(100% - 2px); z-index:300; min-width:250px;
           background:#fff; color:#222; border:1px solid #c3c9d2; border-radius:9px;
           box-shadow:0 8px 26px rgba(0,0,0,.22); padding:7px; }
  .panel.on { display:block; }
  .panel .prow { display:flex; align-items:center; gap:7px; padding:5px 6px; font-size:12.5px; white-space:nowrap; }
  .panel .pl { color:#555; width:74px; flex:0 0 auto; line-height:1.25; }
  .panel .ck { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .panel hr { border:none; border-top:1px solid #e5e7eb; margin:5px 2px; }
  .panel input[type=date], .panel input[type=number], .panel select {
    padding:4px 6px; border:1px solid #c3c9d2; border-radius:5px; background:#fff; color:#111; font-size:12.5px; }
  .panel input[type=number] { width:72px; }
  .panel .mini { padding:5px 9px; border:1px solid #c3c9d2; background:#f6f7f9; border-radius:5px; cursor:pointer; font-size:12px; }
  .panel .mini:hover { background:#e9ecf1; }
  .panel .mi { display:block; width:100%; text-align:left; padding:9px 10px; border:none; background:none;
               border-radius:6px; cursor:pointer; font-size:12.5px; color:#111; }
  .panel .mi:hover { background:#eef4ff; }

  /* ---------- 保存・共有メニュー ---------- */
  #saveMenu { display:none; position:absolute; top:calc(100% - 2px); z-index:300; width:300px;
              background:#fff; color:#222; border:1px solid #c3c9d2; border-radius:9px;
              box-shadow:0 8px 26px rgba(0,0,0,.22); padding:5px; }
  #saveMenu.on { display:block; }
  #saveMenu .mi { display:block; width:100%; text-align:left; padding:9px 10px; border:none; background:none;
                  border-radius:6px; cursor:pointer; font-size:12.5px; color:#111; line-height:1.35; }
  #saveMenu .mi:hover { background:#eef4ff; }
  #saveMenu .mi small { display:block; color:#6b7280; font-size:10.5px; margin-top:2px; }
  #saveMenu .mi[disabled] { opacity:.45; cursor:default; }
  #saveMenu .hdr { padding:6px 10px 3px; font-size:10.5px; color:#6b7280; font-weight:700; }
  #saveMenu hr { border:none; border-top:1px solid #e5e7eb; margin:5px 2px; }

  /* ---------- inspector ---------- */
  #insp { position:relative; flex:0 0 auto; z-index:200; background:#fff; border-top:2px solid #2b3240;
          box-shadow:0 -3px 14px rgba(0,0,0,.14); padding:9px 12px; display:none; font-size:12px;
          max-height:42vh; overflow:auto; }
  #insp.on { display:block; }
  #insp .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  #insp h4 { margin:0 8px 0 0; font-size:12px; white-space:nowrap; }
  #insp input[type=text], #insp input[type=number] { padding:4px 6px; border:1px solid #ccc; border-radius:4px; font-size:12px; }
  #insp textarea { padding:4px 6px; border:1px solid #ccc; border-radius:4px; font-size:12px; font-family:inherit; width:320px; height:52px; resize:vertical; }
  .btn { padding:4px 9px; border:1px solid #ccc; background:#f6f7f9; border-radius:5px; cursor:pointer; font-size:12px; }
  .btn:hover { background:#e9ecf1; }
  .btn.on { background:#2563eb; color:#fff; border-color:#2563eb; }
  .btn.del { background:#fee2e2; border-color:#fca5a5; color:#b91c1c; }
  .sw { width:24px; height:22px; border:1px solid #999; border-radius:4px; cursor:pointer; }
  .sw.on { box-shadow:0 0 0 2px #2563eb; }
  #insp .close { position:absolute; right:10px; top:8px; }

  /* ---------- 指で操作する端末：入力欄は16px以上（これ未満だとiOSが勝手に画面を拡大する） ---------- */
  @media (pointer: coarse) {
    #toolbar input, #toolbar select,
    #insp input, #insp select, #insp textarea { font-size:16px !important; }
    #toolbar input[type=number] { width:70px !important; }
    #insp textarea { width:min(340px, calc(100vw - 40px)); }
    #toolbar, #insp { touch-action:manipulation; }
  }

  /* ---------- 確認ダイアログ ---------- */
  #modal { display:none; position:fixed; inset:0; z-index:950; background:rgba(20,24,31,.45);
           align-items:center; justify-content:center; padding:16px; }
  #modal.on { display:flex; }
  #modal .mbox { background:#fff; border-radius:13px; box-shadow:0 14px 44px rgba(0,0,0,.3);
                 width:min(430px, 100%); padding:18px 18px 14px; max-height:92vh; overflow:auto; }
  #modal .mbox.wide { width:min(760px, 100%); }
  #modal .prev { border:1px solid #d5d9e0; border-radius:8px; background:#fff; margin:2px 0 4px;
                 overflow:auto; max-height:44vh; }
  #modal .prev img { display:block; width:100%; }
  #modal .prev.zoom { cursor:zoom-out; }
  #modal .prev.zoom img { width:auto; max-width:none; }
  #modal .prev:not(.zoom) { cursor:zoom-in; }
  #modal .phint { font-size:11px; color:#6b7280; margin:0 0 6px; }
  #modal h3 { margin:0 0 10px; font-size:15px; }
  #modal .mrow { display:flex; align-items:center; gap:8px; margin:9px 0; font-size:12.5px; }
  #modal .mrow .k { color:#555; width:70px; flex:0 0 auto; }
  #modal .mrow .v { color:#111; font-weight:700; }
  #modal input[type=text] { flex:1 1 auto; padding:8px 9px; border:1px solid #c3c9d2; border-radius:7px;
                            font-size:13px; font-family:inherit; min-width:0; }
  #modal .mnote { font-size:11.5px; color:#6b7280; line-height:1.55; margin:10px 0 0; white-space:pre-line;
                  background:#f6f7f9; border-radius:7px; padding:9px 11px; }
  #modal .mnote.warn { background:#fff4e5; color:#8a4b00; }
  #modal .mbtns { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  #modal .btn { padding:9px 16px; font-size:13px; }
  #modal .mok { background:#1f7a4d; border-color:#1f7a4d; color:#fff; font-weight:700; }
  #modal .mok:hover { background:#26925c; }
  @media (pointer: coarse) { #modal input[type=text] { font-size:16px !important; } #modal .btn { padding:11px 18px; } }

  /* ---------- 処理中の表示 ---------- */
  #busy { display:none; position:fixed; inset:0; z-index:900; align-items:center; justify-content:center;
          background:rgba(20,24,31,.45); color:#fff; font-size:15px; font-weight:700; }

  /* ---------- 画像で分割印刷するとき ---------- */
  #printImgs { display:none; }

  /* ---------- 更新のお知らせ ---------- */
  #updateBar { display:none; flex:0 0 auto; align-items:center; gap:8px; padding:7px 12px;
               background:#e6f4ea; border-bottom:1px solid #86c79b; font-size:12px; color:#14532d; }
  #updateBar.on { display:flex; }
  #updateBar .tb { background:#14532d; border-color:#14532d; }

  /* ---------- 復元バー ---------- */
  #restoreBar { display:none; flex:0 0 auto; align-items:center; gap:8px; padding:7px 12px;
                background:#fff7d6; border-bottom:1px solid #e6cf7a; font-size:12px; color:#5b4a00; }
  #restoreBar.on { display:flex; }
  #restoreBar .tb { background:#5b4a00; border-color:#5b4a00; }

  /* ---------- 狭い画面（スマホ） ---------- */
  @media (max-width: 760px) {
    #toolbar { padding:5px 7px; gap:4px; font-size:11px; }
    .tb { padding:6px 8px; font-size:11px; }
    #toolbar label { gap:3px; }
    #hint { display:none; }
    #insp { max-height:52vh; padding:8px 10px 10px; }
    #insp textarea { width:100%; height:46px; }
    #insp .row { gap:6px; row-gap:7px; }
    #insp h4 { width:100%; margin-bottom:2px; }
    .btn { padding:7px 11px; }
    .sw { width:28px; height:26px; }
    #insp .close { position:static; margin-left:auto; }
    #saveMenu { width:min(290px, calc(100vw - 24px)); }
    #stage { padding:0; }
    #sheet { margin:8px 10px; }
  }

  /* ---------- print ---------- */
  @media print {
    #toolbar, #insp, #hint, #restoreBar, #updateBar, #busy, #modal { display:none !important; }
    body.imgprint > * { display:none !important; }
    body.imgprint #printImgs { display:block !important; }
    #printImgs img { width:100%; display:block; }
    body.imgprint, body.imgprint #printImgs { height:auto !important; }
    #printImgs .pg { page-break-after:always; break-after:page; }
    #printImgs .pg:last-child { page-break-after:auto; break-after:auto; }
    html,body { background:#fff; }
    html, body { height:auto !important; display:block !important; }
    #stage { overflow:hidden !important; height:auto; padding:0; display:block;
             width:var(--pw,auto); height:var(--ph,auto); }
    #sheet { box-shadow:none; padding:0; margin:0; transform: scale(var(--ps,1)); transform-origin: top left;
             width:var(--sw,auto); }
    .rname, #head { position:static !important; }
    .fld { border-bottom:none; }
    .rname:hover, .hcell.num:hover { background:transparent; }
    .bar.sel { outline:none; } .note.sel { outline:none; }
    #remarks textarea { resize:none; overflow:hidden; }
    .rgrip { display:none; }
    .rsel:hover { background:transparent; }
  }
</style>
</head>
<body>

<div id="toolbar">
  <button class="tb" id="btnUndo" title="元に戻す (Ctrl+Z)">↶</button>
  <button class="tb" id="btnRedo" title="やり直す (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <button class="tb" id="btnSave">ファイル ▾</button>
  <button class="tb" id="btnAdd">追加 ▾</button>
  <button class="tb" id="btnCfg">設定 ▾</button>
  <span class="sep"></span>
  <button class="tb pri" id="btnPdf">PDFを作る</button>
  <span class="sep"></span>
  <button class="tb" id="btnFit">画面に合わせる</button>
  <button class="tb" id="btnFinger" title="1本指の役割を切り替えます">指：編集</button>
  <label>拡大 <input type="range" id="inZoom" min="35" max="220" step="5"><span id="zoomval"></span></label>
  <button class="tb" id="btnHelp" title="使い方とショートカット">?</button>
  <span id="hint">ドラッグ＝バー作成／ダブルクリック＝1日バー／端をつまむ＝伸縮／Shift+クリック＝複数選択</span>

  <div id="addPanel" class="panel">
    <button class="mi" id="btnAddRow">工種の行を追加</button>
    <button class="mi" id="btnAddSp">空行を追加</button>
    <button class="mi" id="btnAddNote">注記を追加</button>
  </div>

  <div id="cfgPanel" class="panel">
    <div class="prow"><span class="pl">着工日</span><input type="date" id="inStart"></div>
    <div class="prow"><span class="pl">日数</span><input type="number" id="inDays" min="5" max="200"></div>
    <hr>
    <div class="prow"><label class="ck"><input type="checkbox" id="inShowNum"> 工事日数（1・2・3…）を表示</label></div>
    <div class="prow"><span class="pl">1日目の位置</span><input type="number" id="inNumFrom" min="1" max="200">列目
      <button class="mini" id="btnNumReset">先頭に戻す</button></div>
    <hr>
    <div class="prow"><span class="pl">続けて引いた<br>バー</span>
      <select id="inJoin">
        <option value="1">同じ段に並べる（端点をくっつける）</option>
        <option value="0">下の段に分ける</option>
      </select></div>
    <hr>
    <div class="prow"><span class="pl">休み</span>
      <select id="inRest"><option value="0">日曜のみ</option><option value="06">土日</option><option value="">なし</option></select>
      <label class="ck"><input type="checkbox" id="inHoli"> 祝日も</label></div>
    <div class="prow"><button class="mini" id="btnRest">N日おきにグレーを塗る</button></div>
    <hr>
    <div class="prow"><span class="pl">用紙</span>
      <select id="inPaper">
        <option value="a3">A3横1枚</option><option value="a4">A4横1枚</option>
        <option value="b4">B4横1枚</option><option value="a4x2">A4横2枚（前半・後半）</option>
      </select></div>
  </div>

  <div id="saveMenu"></div>
  <button id="btnNew2" style="display:none"></button>
</div>

<div id="updateBar">
  <span>新しいバージョンがあります。</span>
  <button class="tb" id="btnUpdate">更新する</button>
  <button class="tb" id="btnUpdateLater">あとで</button>
</div>
<div id="restoreBar">
  <span id="restoreMsg"></span>
  <button class="tb" id="btnRestore">前回の続きを復元</button>
  <button class="tb" id="btnDiscard">破棄</button>
</div>
<div id="stage">
  <div id="sheet">
    <div id="shead">
      <div class="grpL">
        <div>
          <span class="ttl">工 事 工 程 表</span>
          <input class="fld" id="fProject" style="width:300px;font-size:14px;font-weight:700" placeholder="現場名・工事名">
        </div>
        <div><span class="lbl">住所：</span><input class="fld" id="fAddr" style="width:340px" placeholder="〒000-0000　○○"></div>
      </div>
      <div class="grpM">
        <div><span class="lbl">工期：</span><input class="fld" id="fTerm1" style="width:150px" placeholder="00年00月00日 －"></div>
        <div><span class="lbl">　　　</span><input class="fld" id="fTerm2" style="width:150px" placeholder="－ 00年00月00日"></div>
      </div>
      <div class="grpM">
        <div><span class="lbl">監理：</span><input class="fld" id="fKanri" style="width:150px"></div>
        <div><span class="lbl">tel　：</span><input class="fld" id="fTel" style="width:150px"></div>
      </div>
      <div class="grpR">
        <div><input class="fld cName" id="fCo" style="width:220px;text-align:right;font-size:14px" placeholder="会社名"></div>
        <div><input class="fld" id="fCoAddr" style="width:300px;text-align:right;font-size:10px" placeholder="〒000-0000　○○"></div>
      </div>
    </div>

    <div id="chart">
      <div id="fills"></div>
      <div id="head"></div>
      <div id="rows"></div>
      <div id="notes"></div>
    </div>

    <div id="remarks">
      <div class="rt">【特記事項】</div>
      <textarea id="fRemarks" rows="3"></textarea>
    </div>
  </div>
</div>

  <div class="mbox">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="mbtns">
      <button class="btn" id="mCancel">キャンセル</button>
      <button class="btn mok" id="mOk">保存する</button>
    </div>
  </div>
</div>

<div id="insp"><div class="row" id="inspBody"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
"use strict";

/* =========================================================
   定数（z=1 のときの寸法 ＝ 印刷時の基準寸法）
   ========================================================= */
const BASE = { COLW:30, NAMEW:118, ROWH:46, LANEH:30, LABGAP:4, HM:14, HN:16, HD:13, HW:13, FS:10.5, NAMEFS:11.5, HFS:9.5 };

/* 工種プルダウンの選択肢 */
const TRADES = ["仮設工事","解体工事","軽鉄工事","造作工事","家具工事","塗装工事","表装工事","左官工事","床工事",
                "ガラス工事","シート工事","サイン工事","電気工事","給排水工事","換気工事","空調工事","弱電工事",
                "厨房工事","ガス工事","B工事"];
const COLORS = { black:"#000000", red:"#e60012", blue:"#1e56c8", green:"#0a7a3c" };
const FILLS = { none:"", gray:"#d9d9d9", yellow:"#ffff00", pink:"#ffd6e7", blue:"#cfe8ff", green:"#d8f0d8" };

let z = 1;
let uid = 1;
const nid = () => "x" + (uid++);

/* =========================================================
   初期データ（参考PDFの工種構成）
   ========================================================= */
/* 工種名は最初はすべて空欄。行の左端をクリックすると工種のプルダウンが開く */
function defaultRows() {
  const rows = [];
  for (let i = 0; i < 18; i++) rows.push({ id:nid(), type:"work", name:"", bg:"", h:BASE.ROWH });
  return rows;
}

function blankState() {
  return {
    meta: {
      project:"", addr:"", term1:"", term2:"", kanri:"", tel:"",
      co:"", coAddr:"", termAuto:true
    },
    startDate: "",
    days: 44,
    showNum: false,          // 工事日数（通し番号）を出すか
    numFrom: 1,              // 何列目を「1日目」とするか
    joinTouch: true,         // 端点が接するだけのバーを同じ段に並べるか
    restWeekdays: [0],       // 0=日, 6=土
    useHolidays: true,       // 祝日も休みにする
    cols: {},                // { "7": {fill:"gray", vtext:"", vcolor:"#000"} }
    rows: defaultRows(),
    bars: [],
    notes: [],
    remarks: "■日中工事時間：－－－－－－－－－－－－－\n■夜間工事時間：－－－－－－－－－－－－－"
  };
}

let S = blankState();
let sel = null;   // {kind:'bar'|'row'|'col'|'note', id/index}

/* =========================================================
   日本の祝日
   ========================================================= */
const HOLI_CACHE = {};
function holidaysOf(year) {
  if (HOLI_CACHE[year]) return HOLI_CACHE[year];
  const H = {};
  const key = (m,d) => m + "-" + d;
  const add = (m,d,n) => { if (d>=1) H[key(m,d)] = n; };
  const nthMon = (m,n) => {
    const dow1 = new Date(year, m-1, 1).getDay();
    return 1 + ((8 - dow1) % 7) + (n-1)*7;
  };
  add(1,1,"元日");
  add(1,nthMon(1,2),"成人の日");
  add(2,11,"建国記念の日");
  if (year >= 2020) add(2,23,"天皇誕生日");
  add(3, Math.floor(20.8431 + 0.242194*(year-1980) - Math.floor((year-1980)/4)), "春分の日");
  add(4,29,"昭和の日");
  add(5,3,"憲法記念日"); add(5,4,"みどりの日"); add(5,5,"こどもの日");
  add(7, nthMon(7,3), "海の日");
  if (year >= 2016) add(8, 11, "山の日");
  add(9,nthMon(9,3),"敬老の日");
  add(9, Math.floor(23.2488 + 0.242194*(year-1980) - Math.floor((year-1980)/4)), "秋分の日");
  add(10, nthMon(10,2), year >= 2020 ? "スポーツの日" : "体育の日");
  add(11,3,"文化の日"); add(11,23,"勤労感謝の日");
  // 年ごとの特例（東京五輪の移動・即位の礼・旧天皇誕生日）
  const del = k => { delete H[k]; };
  if (year <= 2018) { del("2-23"); add(12, 23, "天皇誕生日"); }
  if (year === 2019) {
    del("2-23");
    add(4, 30, "国民の休日"); add(5, 1, "天皇の即位の日"); add(5, 2, "国民の休日");
    add(10, 22, "即位礼正殿の儀の行われる日");
  }
  if (year === 2020) {
    del("7-" + nthMon(7,3)); add(7, 23, "海の日");
    del("10-" + nthMon(10,2)); add(7, 24, "スポーツの日");
    del("8-11"); add(8, 10, "山の日");
  }
  if (year === 2021) {
    del("7-" + nthMon(7,3)); add(7, 22, "海の日");
    del("10-" + nthMon(10,2)); add(7, 23, "スポーツの日");
    del("8-11"); add(8, 8, "山の日");
  }

  // 国民の休日（敬老の日と秋分の日の間が1日だけ空くとき）
  const keiro = nthMon(9,3);
  const shubun = Math.floor(23.2488 + 0.242194*(year-1980) - Math.floor((year-1980)/4));
  if (shubun - keiro === 2) add(9, keiro+1, "国民の休日");
  // 振替休日
  const list = Object.keys(H).slice();
  list.forEach(k => {
    const [m,d] = k.split("-").map(Number);
    if (new Date(year, m-1, d).getDay() === 0) {
      let dt = new Date(year, m-1, d+1);
      while (H[key(dt.getMonth()+1, dt.getDate())]) dt = new Date(year, dt.getMonth(), dt.getDate()+1);
      H[key(dt.getMonth()+1, dt.getDate())] = "振替休日";
    }
  });
  HOLI_CACHE[year] = H;
  return H;
}
function dateOfDay(i) { // i = 1..days
  if (!S.startDate) return null;
  const p = S.startDate.split("-").map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate() + (i-1));
  return d;
}
function isHoliday(d) { return !!holidaysOf(d.getFullYear())[(d.getMonth()+1) + "-" + d.getDate()]; }
function holidayName(d) { return holidaysOf(d.getFullYear())[(d.getMonth()+1) + "-" + d.getDate()] || ""; }
function isRest(d) { return S.restWeekdays.indexOf(d.getDay()) >= 0 || (S.useHolidays && isHoliday(d)); }

/* =========================================================
   寸法ヘルパ
   ========================================================= */
const P  = v => v * z;                       // 基準px → 画面px
const CW = () => BASE.COLW * z;
const NW = () => BASE.NAMEW * z;
const trackW = () => S.days * CW();
/* 見出しに出す行の組み立て（工事日数のオン/オフで変わる） */
const showNum = () => !!S.showNum || !S.startDate;      // 着工日が無いときは番号が唯一の目盛りなので必ず出す
function headRows() {
  const rs = [];
  if (S.startDate) rs.push({ k:"m", h:BASE.HM });
  if (showNum())   rs.push({ k:"n", h:BASE.HN });
  if (S.startDate) { rs.push({ k:"d", h: showNum() ? BASE.HD : BASE.HN }); rs.push({ k:"w", h:BASE.HW }); }
  else             rs.push({ k:"blank", h:BASE.HD });
  return rs;
}
/* 各行は box-sizing:border-box なので、指定した高さに枠線が含まれる（+1しない） */
const headH = () => headRows().reduce((a, r) => a + P(r.h), 0);
const dayNo = i => (i >= (S.numFrom || 1)) ? (i - (S.numFrom || 1) + 1) : "";

function colInfo(i) {
  const c = S.cols[i] || {};
  let fill = c.fill || "";
  if (!fill) {   // 未指定の列だけ、着工日があれば土日祝を自動でグレーに
    const d = dateOfDay(i);
    if (d && isRest(d)) fill = "gray";
  }
  return { fill, vtext: c.vtext || "", vcolor: c.vcolor || "#000000", raw: c };
}

/* =========================================================
   描画
   ========================================================= */
const $ = s => document.querySelector(s);
const el = (t, cls, css) => { const e = document.createElement(t); if (cls) e.className = cls; if (css) Object.assign(e.style, css); return e; };


/* =========================================================
   操作履歴（元に戻す／やり直す）・クリップボード・繰り返し
   ========================================================= */
const HIST = { stack: [], idx: -1, t: null, first: 0 };
function histPush() {
  const snap = JSON.stringify(S);
  if (snap === HIST.stack[HIST.idx]) return;          // 変化なしなら積まない
  HIST.stack = HIST.stack.slice(0, HIST.idx + 1);
  HIST.stack.push(snap);
  if (HIST.stack.length > 60) HIST.stack.shift();                       // 件数の上限
  let bytes = 0; for (let i = 0; i < HIST.stack.length; i++) bytes += HIST.stack[i].length;
  while (HIST.stack.length > 10 && bytes > 4000000) bytes -= HIST.stack.shift().length;  // 総量の上限
  HIST.idx = HIST.stack.length - 1;
  HIST.first = 0;
  if (typeof markDirty === "function") markDirty();
}
/* render() のたびに呼ばれる。連続操作は1件にまとめるが、
   まとめ続けて履歴が飛ぶのを防ぐため、最初の変化から 700ms で必ず1件記録する */
function touch() {
  if (!HIST.first) HIST.first = Date.now();
  clearTimeout(HIST.t);
  const wait = Math.min(350, Math.max(0, HIST.first + 700 - Date.now()));
  HIST.t = setTimeout(histPush, wait);
}
function histApply() {
  S = JSON.parse(HIST.stack[HIST.idx]);
  sel = null; MULTI = []; syncFields(); render(); refreshInsp(); markDirty();
}
function undo() { clearTimeout(HIST.t); histPush(); if (HIST.idx > 0) { HIST.idx--; histApply(); } }
function redo() { if (HIST.idx < HIST.stack.length - 1) { HIST.idx++; histApply(); } }

let MULTI = [];         // 複数選択中のバーID
const isSelBar = id => MULTI.indexOf(id) >= 0;
const selBars  = () => MULTI.map(id => S.bars.find(b => b.id === id)).filter(Boolean);

let CLIP = null;        // コピーしたバー／注記
let LASTFMT = null;     // F4で繰り返す直前の書式変更 {k, v}

function copySel() {
  if (!sel) return false;
  if (sel.kind === "bar") {
    const bs = selBars(); if (!bs.length) return false;
    CLIP = { kind:"bars", data: JSON.parse(JSON.stringify(bs)) }; return true;
  }
  if (sel.kind === "note") { const n = S.notes.find(x => x.id === sel.id); if (n) { CLIP = { kind:"note", data: JSON.parse(JSON.stringify(n)) }; return true; } }
  return false;
}
function pasteClip() {
  if (!CLIP) return;
  if (CLIP.kind === "bars" && !S.rows.some(r => r.type !== "spacer")) { alert("バーを置ける行がありません。先に行を追加してください。"); return; }
  if (CLIP.kind === "bars") {
    const src = CLIP.data;
    const baseRi = S.rows.findIndex(r => r.id === src[0].row);
    // 貼り付け先＝行を選んでいればその行、バーを選んでいればその行、なければコピー元の行
    let target = baseRi;
    if (sel && sel.kind === "row" && S.rows[sel.ri]) target = sel.ri;
    else if (sel && sel.kind === "bar") { const b = S.bars.find(x => x.id === sel.id); if (b) target = S.rows.findIndex(r => r.id === b.row); }
    if (target < 0) target = 0;
    const workAt = k => {                       // 空行は避けて直近の工種行へ
      for (let i = k; i < S.rows.length; i++) if (S.rows[i].type !== "spacer") return i;
      for (let i = k; i >= 0; i--) if (S.rows[i] && S.rows[i].type !== "spacer") return i;
      return -1;
    };
    const ids = [];
    src.forEach(o => {
      const ri = S.rows.findIndex(r => r.id === o.row);
      const ni = workAt(Math.max(0, Math.min(S.rows.length - 1, target + (ri - baseRi))));
      if (ni < 0) return;
      const nb = Object.assign({}, o, { id:nid(), row:S.rows[ni].id });
      delete nb.lane;                  // 段は自動で空いている所へ
      S.bars.push(nb); ids.push(nb.id);
    });
    if (!ids.length) return;
    MULTI = ids; sel = { kind:"bar", id: ids[ids.length - 1] };
    histPush(); render(); refreshInsp();
  } else {
    const nn = Object.assign({}, CLIP.data, { id:nid(), x:CLIP.data.x + 10, y:CLIP.data.y + 10 });
    if (nn.row) { nn.ox = (nn.ox || 0) + 10; nn.oy = (nn.oy || 0) + 10; }   // 紐づけ注記も少しずらす
    S.notes.push(nn); histPush(); select({ kind:"note", id:nn.id });
  }
}
function dupSel() { if (copySel()) pasteClip(); }
function deleteSel() {
  if (!sel) return;
  if (sel.kind === "bar")       { const kill = MULTI.slice(); S.bars = S.bars.filter(b => kill.indexOf(b.id) < 0); select(null); histPush(); }
  else if (sel.kind === "note") { S.notes = S.notes.filter(n => n.id !== sel.id); select(null); histPush(); }
}
function repeatFmt() {
  if (!LASTFMT || !sel || sel.kind !== "bar") return;
  const bs = selBars(); if (!bs.length) return;
  bs.forEach(b => { b[LASTFMT.k] = LASTFMT.v; });
  histPush(); render(); refreshInsp();
}

/* --- 段（レーン）計算：同じ日に重なるバーを自動で上下に振り分ける --- */
function laneMap(rowId) {
  const bs = S.bars.filter(b => b.row === rowId && b.start <= S.days);   // 範囲外は表示しないだけ
  const occ = [];   // occ[L] = [[s,e], ...]
  const map = {};
  /* 端点が接するだけ（前の工程の終わり＝次の工程の始まり）なら、
     設定に応じて同じ段に並べる。1日だけのバーは重なると見えないので必ず別段。 */
  const join = S.joinTouch !== false;
  const hit = (b, iv) => {
    if (join && b.start !== b.end && iv[0] !== iv[1]) return b.start < iv[1] && b.end > iv[0];
    return !(b.end < iv[0] || b.start > iv[1]);
  };
  const fits = (L, b) => !(occ[L] || []).some(iv => hit(b, iv));
  const put  = (L, b) => { (occ[L] = occ[L] || []).push([b.start, b.end]); map[b.id] = L; };
  bs.filter(b => Number.isInteger(b.lane)).sort((a, b) => a.lane - b.lane)
    .forEach(b => { let L = Math.max(0, b.lane); while (!fits(L, b)) L++; put(L, b); });
  bs.filter(b => !Number.isInteger(b.lane)).sort((a,b) => a.start - b.start || a.end - b.end)
    .forEach(b => { let L = 0; while (!fits(L, b)) L++; put(L, b); });
  return { map, lanes: Math.max(1, occ.length) };
}

function rowTops(geo) {
  const t = []; let y = 0;
  geo.rowH.forEach(h => { t.push(y); y += h; });
  return t;
}
function computeGeo() {
  const rowH = [], lanesArr = [], maps = [], laneHs = [];
  S.rows.forEach(r => {
    if (r.type === "spacer") { rowH.push(r.h); lanesArr.push(0); maps.push({}); laneHs.push(BASE.LANEH); return; }
    const lm = laneMap(r.id);
    // ラベルが複数行なら、その分だけ段を高くする（画像でも切れないように）
    let extra = 0;
    S.bars.forEach(b => {
      if (b.row !== r.id || !b.label) return;
      const lines = String(b.label).split("\n").length;
      if (lines > 1) extra = Math.max(extra, (lines - 1) * (b.fs || BASE.FS) * 1.22);
    });
    const lh = BASE.LANEH + extra;
    lanesArr.push(lm.lanes); maps.push(lm.map); laneHs.push(lh);
    rowH.push(Math.max(r.h, lm.lanes * lh + 24));   // 上下に指で掴める余白を残す
  });
  return { rowH, lanesArr, maps, laneHs };
}

let RAF = null;
function renderSoon() { if (RAF) return; RAF = requestAnimationFrame(() => { RAF = null; render(); }); }

function render() {
  if (RAF) { cancelAnimationFrame(RAF); RAF = null; }
  const geo = computeGeo();
  renderHead();
  renderRows(geo);
  renderFills(geo);
  renderNotes(geo);
  $("#chart").style.width = (NW() + trackW()) + "px";
  $("#remarks").style.width = (NW() + trackW() - 16) + "px";   // 左右パディング8px分を引く
  $("#remarks").style.fontSize = P(10) + "px";
  $("#shead").style.fontSize = P(11) + "px";
  document.querySelectorAll("#shead .fld").forEach(inp => {
    if (inp.dataset.bw === undefined) inp.dataset.bw = parseFloat(inp.style.width) || 150;
    inp.style.width = (+inp.dataset.bw * z) + "px";
  });
  $("#shead .ttl").style.fontSize = P(16) + "px";
  touch();
}

/* --- ヘッダ（月 / 番号 / 日 / 曜） --- */
function renderHead() {
  const H = $("#head"); H.innerHTML = "";
  const cw = CW();
  const rowsDef = headRows();
  const mainKey = showNum() ? "n" : (S.startDate ? "d" : "n");   // 「工事内容　日程」を入れる行

  const mkRow = (rd) => {
    const r = el("div", "r hr");
    const n = el("div", "rname", { width:NW()+"px", height:P(rd.h)+"px", minWidth:NW()+"px",
                                   fontSize:P(BASE.NAMEFS)+"px", cursor:"default" });
    n.textContent = rd.k === mainKey ? "工事内容　　日程" : "";
    const t = el("div", "track", { width:trackW()+"px", height:P(rd.h)+"px" });
    r.appendChild(n); r.appendChild(t); H.appendChild(r);
    return t;
  };
  /* 見出しの中の列の色は、見出しを画面上部に貼り付けても消えないよう、
     ここ（見出しのセル自身）に付ける。月の欄には付けない。 */
  const fillOf = i => { const ci = colInfo(i); return (ci.fill && FILLS[ci.fill]) ? FILLS[ci.fill] : ""; };

  rowsDef.forEach(rd => {
    const t = mkRow(rd);

    if (rd.k === "m") {                       // 月（同じ月をまとめる）
      let i = 1;
      while (i <= S.days) {
        const d = dateOfDay(i); let j = i;
        while (j + 1 <= S.days && dateOfDay(j + 1).getMonth() === d.getMonth()) j++;
        const b = el("div", "mblk", { left:((i-1)*cw)+"px", width:((j-i+1)*cw)+"px", fontSize:P(BASE.HFS)+"px" });
        b.textContent = (d.getMonth()+1) + "月";
        t.appendChild(b); i = j + 1;
      }
      return;
    }

    for (let i = 1; i <= S.days; i++) {
      const bg = fillOf(i);
      const c = el("div", "hcell", { left:((i-1)*cw)+"px", width:cw+"px",
                                     fontSize:P(BASE.HFS - (rd.k === "n" ? 0 : 0.5))+"px",
                                     background: bg || "transparent" });
      const d = dateOfDay(i);
      if (rd.k === "n") {
        c.classList.add("num");
        c.textContent = dayNo(i);
        c.style.fontWeight = "700";
        if (sel && sel.kind === "col" && sel.i === i) c.classList.add("sel");
        c.addEventListener("pointerdown", ev => { ev.stopPropagation(); selectCol(i); });
      } else if (rd.k === "d" && d) {
        c.textContent = d.getDate();
        if (!showNum()) {                     // 番号を出さないときは日付の行で列を選べるように
          c.classList.add("num"); c.style.fontWeight = "700";
          if (sel && sel.kind === "col" && sel.i === i) c.classList.add("sel");
          c.addEventListener("pointerdown", ev => { ev.stopPropagation(); selectCol(i); });
        }
      } else if (rd.k === "w" && d) {
        c.textContent = "日月火水木金土"[d.getDay()];
        if (isHoliday(d)) c.title = holidayName(d);
      }
      if (d && rd.k !== "n") {
        const cls = ((S.useHolidays && isHoliday(d)) || d.getDay() === 0) ? "sun" : (d.getDay() === 6 ? "sat" : "");
        if (cls) c.classList.add(cls);
      }
      t.appendChild(c);
    }
  });
}

/* --- 本体行 + バー --- */
function renderRows(geo) {
  const R = $("#rows"); R.innerHTML = "";
  S.rows.forEach((row, ri) => {
    const H = geo.rowH[ri];
    const r = el("div", "r"); r.dataset.ri = ri;
    const n = el("div", "rname", { width:NW()+"px", minWidth:NW()+"px", height:P(H)+"px",
                                   fontSize:P(BASE.NAMEFS)+"px", background: row.bg || "#fff",
                                   position:"sticky" });
    if (sel && sel.kind === "row" && sel.ri === ri) n.classList.add("sel");
    if (row.type !== "spacer") n.appendChild(rowNameCtl(row, ri));
    const grip = el("div", "rgrip");
    grip.title = "行の設定（高さ・背景・追加・削除）";
    grip.addEventListener("pointerdown", ev => { ev.stopPropagation(); selectRow(ri); });
    n.appendChild(grip);

    const t = el("div", "track", { width:trackW()+"px", height:P(H)+"px" });
    t.dataset.ri = ri;
    t.addEventListener("pointerdown", onTrackDown);
    S.bars.filter(b => b.row === row.id && b.start <= S.days)
          .forEach(b => t.appendChild(barEl(b, H, geo.maps[ri][b.id] || 0, geo.lanesArr[ri], geo.laneHs[ri])));
    r.appendChild(n); r.appendChild(t); R.appendChild(r);
  });
}

/* 選択肢は一度だけ組み立てて複製する（毎回作り直すと描画が重くなる） */
let SELTPL = null;
function tradeSelectEl() {
  if (!SELTPL) {
    SELTPL = document.createElement("select");
    SELTPL.className = "rsel";
    const opt = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; SELTPL.appendChild(o); };
    opt("", ""); TRADES.forEach(t => opt(t, t)); opt("__free__", "（自由入力）");
  }
  return SELTPL.cloneNode(true);
}

/* 工種名セル：プルダウン（＋自由入力） */
function rowNameCtl(row, ri) {
  if (row.editing) {
    const i = el("input", "rfree"); i.type = "text"; i.value = row.name;
    const done = () => { row.name = i.value.trim(); row.editing = false; render(); };
    i.addEventListener("blur", done);
    i.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); done(); } });
    setTimeout(() => { i.focus(); i.select(); }, 0);
    return i;
  }
  const s = tradeSelectEl();
  if (row.name && TRADES.indexOf(row.name) < 0) {   // 自由入力された名前を選択肢に足す
    const o = document.createElement("option"); o.value = row.name; o.textContent = row.name;
    s.insertBefore(o, s.lastChild);
  }
  s.value = row.name || "";
  s.addEventListener("pointerdown", ev => ev.stopPropagation());
  s.addEventListener("change", () => {
    if (s.value === "__free__") { row.editing = true; render(); return; }
    row.name = s.value;
    // B工事の行は参考書式に合わせて水色。手で塗った色は上書きしない
    if (row.name === "B工事" && !row.bg) { row.bg = "#e8f2fb"; row.autoBg = true; }
    else if (row.autoBg && row.name !== "B工事") { row.bg = ""; delete row.autoBg; }
    histPush(); render();
  });
  return s;
}

function barEl(b, rowHpx, lane, lanes, laneH) {
  const cw = CW();
  const L = (b.start - 1) * cw + cw/2;
  const W = (Math.min(b.end, S.days) - b.start) * cw;
  const PAD = P(8);
  const LH = P(laneH || BASE.LANEH);
  const cy = (P(rowHpx) - lanes*LH)/2 + lane*LH + LH*0.40;
  const e = el("div", "bar", { left:(L - PAD)+"px", width:(W + PAD*2)+"px",
                               top:(cy - P(7))+"px", height:P(14)+"px" });
  e.dataset.id = b.id;
  if (isSelBar(b.id)) e.classList.add("sel");
  const col = b.color || COLORS.black;

  const inr = el("div", "in", { left:PAD+"px", width:W+"px" });
  if (W > 0) {
    const ln = el("div", "ln", { borderTopColor:col, borderTopStyle: b.dash ? "dashed" : "solid",
                                 borderTopWidth: Math.max(1.5, P(2.4))+"px" });
    inr.appendChild(ln);
  }
  const ds = P(7);
  const mkDot = pos => { const d = el("div", "dot", { width:ds+"px", height:ds+"px", background:col,
                          marginTop:(-ds/2)+"px" }); d.style[pos] = (-ds/2)+"px"; return d; };
  if (b.dots !== false) { inr.appendChild(mkDot("left")); if (W > 0) inr.appendChild(mkDot("right")); }
  else if (W === 0) inr.appendChild(mkDot("left"));   // 1日作業は点が無いと見えないので必ず出す

  if (b.label) {
    const lab = el("div", "lab", { fontSize:P(b.fs || BASE.FS)+"px", color: b.labColor || col });
    lab.textContent = b.label;
    const al = b.align || "center";
    if (al === "center") { lab.style.left = "50%"; lab.style.transform = "translateX(-50%)"; lab.style.textAlign = "center"; }
    else if (al === "left") { lab.style.left = "0px"; lab.style.textAlign = "left"; }
    else { lab.style.right = "0px"; lab.style.textAlign = "right"; }
    const G = P(7 + BASE.LABGAP) + "px";
    if (b.pos === "above") lab.style.bottom = G; else lab.style.top = G;
    inr.appendChild(lab);
  }
  e.appendChild(inr);
  e.appendChild(el("div", "hL")); e.appendChild(el("div", "hR"));
  e.addEventListener("pointerdown", onBarDown);
  return e;
}

/* --- 列の塗り + 縦書き --- */
function renderFills(geo) {
  const F = $("#fills"); F.innerHTML = "";
  F.style.left = NW() + "px"; F.style.width = trackW() + "px";
  const cw = CW(), hh = headH();
  // 列の色は「月」の欄には伸ばさない（番号行の上端から）
  const fillTop = hh;

  // 1) 行の背景（列の色より下に敷く）
  let y = hh;
  S.rows.forEach((row, ri) => {
    const h = P(geo.rowH[ri]);
    if (row.bg) F.appendChild(el("div", "rowbg", { top:y+"px", height:h+"px", background:row.bg }));
    y += h;
  });
  const bodyBottom = y;

  // 2) 列の色 → 3) 縦罫線 → 4) 縦書き文字
  for (let i = 1; i <= S.days; i++) {
    const ci = colInfo(i);
    if (ci.fill && FILLS[ci.fill]) {
      F.appendChild(el("div", "fill", { left:((i-1)*cw)+"px", width:cw+"px",
                                        top:fillTop+"px", height:(bodyBottom-fillTop)+"px",
                                        background:FILLS[ci.fill] }));
    }
  }
  for (let i = 1; i < S.days; i++) {
    F.appendChild(el("div", "vline", { left:(i*cw)+"px", top:hh+"px", height:(bodyBottom-hh)+"px" }));
  }
  for (let i = 1; i <= S.days; i++) {
    const ci = colInfo(i);
    if (ci.vtext) {
      const v = el("div", "vtext", { left:((i-1)*cw)+"px", width:cw+"px", top:hh+"px", bottom:"0px",
                                     fontSize:P(11)+"px", color:ci.vcolor });
      Array.from(ci.vtext).forEach(ch => {
        const s = el("span");
        s.textContent = ch === " " || ch === "　" ? " " : ch;
        v.appendChild(s);
      });
      F.appendChild(v);
    }
  }
}

/* --- 自由注記 --- */
/* 注記の位置（z=1基準・日程エリア左上から）。行と日に紐づけていればそこから計算する */
function notePos(n, geo) {
  if (n.row) {
    const ri = S.rows.findIndex(r => r.id === n.row);
    if (ri >= 0) return { x: (Math.min(n.day, S.days) - 1) * BASE.COLW + (n.ox || 0), y: rowTops(geo)[ri] + (n.oy || 0) };
  }
  return { x: n.x, y: n.y };
}
/* いま置かれている位置から、行と日を割り出して覚え直す */
function reanchor(n, geo) {
  if (!n.row) return;
  const tops = rowTops(geo);
  let ri = 0;
  for (let i = 0; i < tops.length; i++) if (n.y >= tops[i]) ri = i;
  n.row = S.rows[ri].id;
  n.oy  = n.y - tops[ri];
  n.day = Math.min(S.days, Math.max(1, Math.floor(n.x / BASE.COLW) + 1));
  n.ox  = n.x - (n.day - 1) * BASE.COLW;
}

function renderNotes(geo) {
  const N = $("#notes"); N.innerHTML = "";
  N.style.left = NW() + "px"; N.style.top = headH() + "px";
  geo = geo || computeGeo();
  S.notes.forEach(n => {
    const pos = notePos(n, geo);
    n.x = pos.x; n.y = pos.y;
    const e = el("div", "note" + (n.vert ? " vert" : ""), { left:P(pos.x)+"px", top:P(pos.y)+"px",
      fontSize:P(n.fs || BASE.FS)+"px", color:n.color || "#000", background: n.bg || "transparent" });
    if (n.vert) Array.from(String(n.text).replace(/\n/g, "")).forEach(ch => {
      const sp = el("span"); sp.textContent = ch; e.appendChild(sp);
    });
    else e.textContent = n.text;
    e.dataset.id = n.id;
    if (sel && sel.kind === "note" && sel.id === n.id) e.classList.add("sel");
    e.addEventListener("pointerdown", onNoteDown);
    e.addEventListener("dblclick", () => { selectNote(n.id); $("#inspNoteText") && $("#inspNoteText").focus(); });
    N.appendChild(e);
  });
}

/* =========================================================
   マウス操作
   ========================================================= */
/* 注意：ドラッグ中は render() で DOM が作り直されるため、
   要素参照ではなく「押した瞬間の矩形」を保持して座標計算する。 */
function dayFromRect(rect, clientX) {
  const per = rect.width / S.days;
  if (!per) return 1;
  let d = Math.floor((clientX - rect.left) / per) + 1;
  return Math.min(S.days, Math.max(1, d));
}
function rowIndexAtY(clientY) {
  const rows = document.querySelectorAll("#rows .r");
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    if (clientY >= r.top && clientY < r.bottom) return i;
  }
  return -1;
}
const rowTrack = ri => document.querySelector('#rows .r[data-ri="' + ri + '"] .track');

let drag = null;
let LASTTAP = { t:0, x:0, y:0, ri:-1 };   // ダブルタップ判定用

function onTrackDown(ev) {
  if (ev.button > 0) return;
  const ri = +ev.currentTarget.dataset.ri;
  if (S.rows[ri].type === "spacer") { selectRow(ri); return; }
  const d0 = dayFromRect(ev.currentTarget.getBoundingClientRect(), ev.clientX);

  // 素早く2回叩いたら、その日に1日だけのバーを置く
  const now = Date.now();
  const dbl = (now - LASTTAP.t < 420) && LASTTAP.ri === ri &&
              Math.abs(ev.clientX - LASTTAP.x) < 26 && Math.abs(ev.clientY - LASTTAP.y) < 26;
  LASTTAP = { t: now, x: ev.clientX, y: ev.clientY, ri };
  if (dbl) {
    LASTTAP.t = 0;
    ev.preventDefault();
    addBarToRow(S.rows[ri].id, d0, d0);
    return;
  }

  if (sel) { sel = null; render(); refreshInsp(); }   // 先に再描画してから掴む
  const track = rowTrack(ri);
  if (!track) return;
  const ghost = el("div", "ghost", { top:"2px", bottom:"2px" });
  track.appendChild(ghost);
  drag = { mode:"create", ri, rect: track.getBoundingClientRect(), d0, d1:d0, ghost,
           px0: ev.clientX, py0: ev.clientY, maxMove: 0 };
  paintGhost();
  ev.preventDefault();
}

function onBarDown(ev) {
  if (ev.button > 0) return;
  ev.stopPropagation();
  const e = ev.currentTarget;
  const b = S.bars.find(x => x.id === e.dataset.id);
  if (!b) return;
  const rect = e.parentElement.getBoundingClientRect();
  const r = e.getBoundingClientRect();
  if (ev.shiftKey) { selectBar(b.id, true); ev.preventDefault(); return; }
  if (!isSelBar(b.id)) selectBar(b.id);
  else { sel = { kind:"bar", id:b.id }; render(); refreshInsp(); }

  const near = (ev.pointerType === "touch") ? 16 : 9;
  let mode = "move";
  if (ev.clientX - r.left <= near && b.end > b.start) mode = "resL";
  else if (r.right - ev.clientX <= near && b.end > b.start) mode = "resR";
  const group = (mode === "move" ? selBars() : [b]).map(x => ({ b:x, s0:x.start, e0:x.end, row0:x.row }));
  drag = { mode, bar:b, rect, x0:ev.clientX, anchor: dayFromRect(rect, ev.clientX),
           s0:b.start, e0:b.end, group, moved:false,
           ri0: S.rows.findIndex(r => r.id === b.row), riLast: -1 };
  ev.preventDefault();
}

function onNoteDown(ev) {
  if (ev.button > 0) return;
  ev.stopPropagation();
  const e = ev.currentTarget;
  const n = S.notes.find(x => x.id === e.dataset.id);
  if (!n) return;
  drag = { mode:"note", note:n, x0:ev.clientX, y0:ev.clientY, nx:n.x, ny:n.y, moved:false };
  selectNote(n.id);
  ev.preventDefault();
}

function paintGhost() {
  const cw = CW();
  const a = Math.min(drag.d0, drag.d1), b = Math.max(drag.d0, drag.d1);
  Object.assign(drag.ghost.style, { left:((a-1)*cw)+"px", width:((b-a+1)*cw)+"px" });
}

document.addEventListener("pointermove", ev => {
  if (!drag) return;
  if (drag.mode === "create") {
    drag.maxMove = Math.max(drag.maxMove, Math.abs(ev.clientX - drag.px0), Math.abs(ev.clientY - drag.py0));
    drag.d1 = dayFromRect(drag.rect, ev.clientX); paintGhost(); return;
  }
  if (drag.mode === "note") {
    const dx = (ev.clientX - drag.x0) / z, dy = (ev.clientY - drag.y0) / z;
    if (Math.abs(dx) + Math.abs(dy) > 1) drag.moved = true;
    drag.note.x = Math.max(0, drag.nx + dx);
    drag.note.y = Math.max(0, drag.ny + dy);
    renderNotes(); return;
  }
  const d = dayFromRect(drag.rect, ev.clientX);
  const b = drag.bar;
  if (drag.mode === "move") {
    // 移動は「掴んだ点からのピクセル差」を丸める（列境界での取りこぼしを防ぐ）
    let off = Math.round((ev.clientX - drag.x0) / (drag.rect.width / S.days));
    if (off !== 0) drag.moved = true;
    let lo = Infinity, hi = -Infinity;
    drag.group.forEach(g => { lo = Math.min(lo, g.s0); hi = Math.max(hi, g.e0); });
    off = Math.max(1 - lo, Math.min(S.days - hi, off));       // 全部が枠内に収まる範囲へ
    drag.group.forEach(g => { g.b.start = g.s0 + off; g.b.end = g.e0 + off; });

    // 上下に動かしたら行も移す
    const ri = rowIndexAtY(ev.clientY);
    if (ri >= 0 && ri !== drag.riLast) {
      drag.riLast = ri;
      const dRow = ri - drag.ri0;
      if (dRow !== 0 || drag.movedRow) {
        drag.movedRow = true; drag.moved = true;
        drag.group.forEach(g => {
          const from = S.rows.findIndex(r => r.id === g.row0);
          if (from < 0) return;
          let to = Math.max(0, Math.min(S.rows.length - 1, from + dRow));
          if (S.rows[to].type === "spacer") {                 // 空行は飛ばす
            let k = to;
            while (k < S.rows.length && S.rows[k].type === "spacer") k++;
            if (k >= S.rows.length) { k = to; while (k >= 0 && S.rows[k].type === "spacer") k--; }
            if (k >= 0 && k < S.rows.length) to = k;
          }
          if (S.rows[to] && S.rows[to].type !== "spacer") g.b.row = S.rows[to].id;
        });
      }
    }
  } else if (drag.mode === "resL") {
    b.start = Math.min(b.end, Math.max(1, d)); drag.moved = true;
  } else if (drag.mode === "resR") {
    b.end = Math.max(b.start, Math.min(S.days, d)); drag.moved = true;
  }
  renderSoon();          // 1フレームに1回だけ描き直す（ドラッグのカクつき対策）
});

document.addEventListener("pointercancel", () => { if (drag && drag.ghost && drag.ghost.parentNode) drag.ghost.remove(); drag = null; render(); });
document.addEventListener("pointerup", () => {
  if (!drag) return;
  if (drag.mode === "create") {
    if (drag.ghost.parentNode) drag.ghost.remove();
    const a = Math.min(drag.d0, drag.d1), b = Math.max(drag.d0, drag.d1);
    if (drag.maxMove < 8) { drag = null; return; }   // 軽く触れただけではバーを作らない（1日バーはダブルタップ）
    const nb = { id:nid(), row:S.rows[drag.ri].id, start:a, end:b, label:"", pos:"below",
                 align:"center", color:COLORS.black, dash:false, fs:BASE.FS };
    S.bars.push(nb);
    drag = null; render(); selectBar(nb.id);
    clearTimeout(HIST.t); histPush();                   // バー作成も1操作＝1履歴
    const ta = $("#inspLabel"); if (ta) { ta.focus(); }
    return;
  }
  if (drag.mode === "note" && drag.note.row) reanchor(drag.note, computeGeo());
  const moved = drag.moved;
  drag = null;
  render(); refreshInsp();
  if (moved) { clearTimeout(HIST.t); histPush(); }     // 移動・伸縮は1操作＝1履歴
});

document.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName || "").toLowerCase();
  const inText = (tag === "input" || tag === "textarea" || tag === "select");
  const mod = ev.ctrlKey || ev.metaKey;

  /* 文字入力中でも効かせるもの */
  if (mod && (ev.key === "s" || ev.key === "S")) { ev.preventDefault(); doSave(); return; }
  if (mod && (ev.key === "p" || ev.key === "P")) { ev.preventDefault(); doPrint(); return; }

  /* 文字入力中はブラウザ標準の編集操作にゆずる */
  if (inText) return;

  if (mod && (ev.key === "z" || ev.key === "Z")) { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && (ev.key === "y" || ev.key === "Y")) { ev.preventDefault(); redo(); return; }
  if (mod && (ev.key === "c" || ev.key === "C")) { ev.preventDefault(); copySel(); return; }
  if (mod && (ev.key === "x" || ev.key === "X")) { ev.preventDefault(); if (copySel()) deleteSel(); return; }
  if (mod && (ev.key === "v" || ev.key === "V")) { ev.preventDefault(); pasteClip(); return; }
  if (mod && (ev.key === "d" || ev.key === "D")) { ev.preventDefault(); dupSel(); return; }
  if (ev.key === "F4") { ev.preventDefault(); repeatFmt(); return; }
  if (ev.key === "Escape") { select(null); return; }

  if (!sel) return;

  if (ev.key === "Delete" || ev.key === "Backspace") { ev.preventDefault(); deleteSel(); return; }

  if (sel.kind === "bar") {
    const b = S.bars.find(x => x.id === sel.id); if (!b) return;
    const len = b.end - b.start;
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
      let d = ev.key === "ArrowLeft" ? -1 : 1;
      if (ev.shiftKey) {                       // Shift＋←→ ＝ 右端を伸縮
        selBars().forEach(x => { x.end = Math.max(x.start, Math.min(S.days, x.end + d)); });
      } else {                                 // ←→ ＝ 1日ずらす（選択中すべて）
        const bs = selBars();
        let lo = Infinity, hi = -Infinity;
        bs.forEach(x => { lo = Math.min(lo, x.start); hi = Math.max(hi, x.end); });
        d = Math.max(1 - lo, Math.min(S.days - hi, d));
        bs.forEach(x => { x.start += d; x.end += d; });
      }
      render(); refreshInsp(); ev.preventDefault(); return;
    }
    if (ev.key === "ArrowUp" || ev.key === "ArrowDown") {   // 段を上下
      const ri = S.rows.findIndex(r => r.id === b.row);
      const cur = (computeGeo().maps[ri] || {})[b.id] || 0;
      b.lane = Math.max(0, cur + (ev.key === "ArrowUp" ? -1 : 1));
      render(); refreshInsp(); ev.preventDefault(); return;
    }
  }
});


/* 指定した行に、空いている段へバーを1本足す */
function addBarToRow(rowId, from, to) {
  const row = S.rows.find(r => r.id === rowId);
  if (!row || row.type === "spacer") return;
  let a = from, b = to;
  if (!a) {                       // 指定がなければ今見えている範囲の左寄りに置く
    const st = $("#stage");
    const d = Math.floor((st.scrollLeft - NW()) / CW()) + 2;
    a = Math.min(S.days - 2, Math.max(1, d));
    b = Math.min(S.days, a + 2);
  }
  const nb = { id:nid(), row:rowId, start:a, end:b, label:"", pos:"below",
               align:"center", color:COLORS.black, dash:false, fs:BASE.FS };
  S.bars.push(nb);
  histPush(); selectBar(nb.id);
  const ta = $("#inspLabel"); if (ta) ta.focus();
}

/* =========================================================
   選択とインスペクタ
   ========================================================= */
function select(v) { if (!v || v.kind !== "bar") MULTI = []; sel = v; render(); refreshInsp(); }
function selectBar(id, add) {
  if (add) {                                   // Shift＋クリック＝選択に足す／外す
    const i = MULTI.indexOf(id);
    if (i >= 0) {
      MULTI.splice(i, 1);
      if (!MULTI.length) { select(null); return; }
      sel = { kind:"bar", id: MULTI[MULTI.length - 1] };
    } else { MULTI.push(id); sel = { kind:"bar", id }; }
    render(); refreshInsp(); return;
  }
  MULTI = [id]; select({ kind:"bar", id });
}
const selectRow  = ri => select({ kind:"row",  ri });
const selectCol  = i  => select({ kind:"col",  i });
const selectNote = id => select({ kind:"note", id });

function refreshInsp() {
  const box = $("#insp"), body = $("#inspBody");
  body.innerHTML = "";
  box.querySelectorAll(".close").forEach(e => e.remove());
  if (!sel) { box.classList.remove("on"); return; }
  box.classList.add("on");

  const h = t => { const e = el("h4"); e.textContent = t; body.appendChild(e); return e; };
  const btn = (t, fn, on, cls) => { const e = el("button", "btn" + (on ? " on" : "") + (cls ? " " + cls : ""));
    e.textContent = t; e.onclick = fn; body.appendChild(e); return e; };
  const gap = () => body.appendChild(el("span", "", { width:"10px" }));
  const lab = t => { const e = el("span"); e.textContent = t; e.style.color = "#555"; body.appendChild(e); };

  if (sel.kind === "bar") {
    const b = S.bars.find(x => x.id === sel.id);
    if (!b) { select(null); return; }
    const many = MULTI.length > 1;
    h(many ? ("工程バー " + MULTI.length + "本を選択中") : "工程バー");
    if (!many) {
      const ta = el("textarea"); ta.id = "inspLabel"; ta.value = b.label;
      ta.placeholder = "ラベル（改行で複数行）\n例：天井LGS組→PB、ケイカル貼";
      ta.oninput = () => { b.label = ta.value; renderSoon(); };
      body.appendChild(ta);
    }
    // 書式変更は LASTFMT に記録 → F4 で他のバーに繰り返せる
    const setF = (k, v) => { selBars().forEach(x => { x[k] = v; }); LASTFMT = { k, v }; histPush(); render(); refreshInsp(); };
    lab("位置"); btn("上", () => setF("pos","above"), b.pos==="above");
    btn("下", () => setF("pos","below"), b.pos!=="above");
    lab("揃え");
    ["left","center","right"].forEach(a =>
      btn({left:"左",center:"中",right:"右"}[a], () => setF("align",a), (b.align||"center")===a));
    gap(); lab("線");
    btn("実線", () => setF("dash",false), !b.dash);
    btn("点線", () => setF("dash",true),  !!b.dash);
